<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MBA Lounge — 웹앱</title>
<meta name="theme-color" content="#6C5CE7" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="MBA Lounge" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<!-- Firebase (계정·가입승인 백엔드) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --pri:#6C5CE7; --pri2:#8B7CF7; --soft:#EFEBFF;
    --bg:#F5F6FB; --card:#fff; --ink:#1F2430; --sub:#8A90A0; --line:#ECEEF4;
    --shadow:0 2px 16px rgba(31,36,48,.07); --r:16px;
    --green:#22C55E; --green-s:#E9F9EF; --amber:#F59E0B;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif}
  body{background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}
  .hidden{display:none !important}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d7dae6;border-radius:8px}
  .mark{display:inline-block;line-height:0}
  .mark svg{display:block}
  .ic{display:inline-block;vertical-align:-.18em;flex-shrink:0}
  .club-ic{width:52px;height:52px;border-radius:14px;background:var(--soft);color:var(--pri);display:flex;align-items:center;justify-content:center;margin:0 auto}
  .nav-item .ni svg,.k-ic svg{display:block}
  .avatar{border-radius:50%;background:var(--soft);color:var(--pri);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;background-size:cover;background-position:center;overflow:hidden}

  /* ---------- Login ---------- */
  #login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1000px 600px at 50% -10%,var(--soft),var(--bg));padding:24px;overflow:auto}
  .login-card{background:var(--card);border-radius:26px;box-shadow:0 30px 80px rgba(31,36,48,.16);width:100%;max-width:760px;padding:40px;margin:auto}
  .login-brand{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:800;justify-content:center}
  .login-brand b{color:var(--pri)}
  .login-sub{text-align:center;color:var(--sub);margin-top:8px;font-size:14.5px}
  .tabs{display:flex;gap:8px;background:var(--bg);border-radius:12px;padding:5px;margin:26px auto 20px;max-width:320px}
  .tabs button{flex:1;border:none;background:none;padding:10px;border-radius:9px;font-weight:800;font-size:14.5px;color:var(--sub)}
  .tabs button.on{background:#fff;color:var(--pri);box-shadow:var(--shadow)}
  .login-step{font-weight:800;margin:20px 0 12px;font-size:14.5px;display:flex;align-items:center;gap:8px}
  .login-step .st-n{width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:800}
  .school-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  @media(max-width:640px){.school-grid{grid-template-columns:repeat(3,1fr)}}
  .school-btn{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;transition:.15s;text-align:center}
  .school-btn:hover{border-color:var(--pri);transform:translateY(-2px);box-shadow:var(--shadow)}
  .school-btn.sel{border-color:var(--pri);background:var(--soft)}
  .school-btn .snm{font-size:12px;font-weight:700;color:var(--ink)}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.fields{grid-template-columns:1fr}}
  .fld label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:6px}
  .fld .req{color:var(--pri)}
  .fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;font-size:14px;background:#fff;outline:none;font-family:inherit}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pri)}
  .fld.full{grid-column:1 / -1}
  .remember{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:14px;font-weight:600;color:#444b59;cursor:pointer}
  .remember input{width:18px;height:18px;accent-color:var(--pri)}
  .login-go{margin-top:20px;width:100%;border:none;border-radius:13px;padding:15px;font-size:16px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 12px 26px rgba(108,92,231,.35);transition:.15s}
  .login-go:hover{transform:translateY(-1px)}
  .login-go:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .login-note{text-align:center;color:var(--sub);font-size:12px;margin-top:16px;line-height:1.7}
  .login-note code{background:var(--bg);padding:2px 6px;border-radius:5px;color:var(--pri-dark);font-weight:700}
  .login-schools{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px auto 4px;max-width:660px}
  .sch-chip{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:22px;
    padding:6px 14px 6px 8px;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;transition:.15s}
  .sch-chip:hover{border-color:var(--pri);transform:translateY(-1px)}
  .sch-chip.sel{border-color:var(--pri);background:var(--soft);color:var(--pri)}
  .login-hint{text-align:center;color:var(--sub);font-size:12px;margin-top:2px}

  /* ---------- App shell ---------- */
  .topbar{position:sticky;top:0;z-index:40;height:64px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:16px;padding:0 22px}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800}
  .topbar .brand b{color:var(--pri)}
  .school-chip{display:flex;align-items:center;gap:9px;background:var(--soft);color:var(--pri);border:1px solid transparent;
    border-radius:22px;padding:6px 14px 6px 8px;font-weight:800;font-size:13.5px;cursor:pointer}
  .school-chip:hover{border-color:var(--pri)}
  .topbar .spacer{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 14px;width:280px;color:var(--sub)}
  .search input{border:none;background:none;outline:none;width:100%;font-size:14px;color:var(--ink)}
  @media(max-width:900px){.search{display:none}}
  .me-btn{display:flex;align-items:center;gap:10px;background:none;border:none;padding:4px}

  .shell{display:grid;grid-template-columns:248px 1fr;align-items:start;max-width:1280px;margin:0 auto}
  @media(max-width:860px){.shell{grid-template-columns:1fr}}
  .sidebar{position:sticky;top:64px;padding:22px 16px;height:calc(100vh - 64px);overflow:auto}
  @media(max-width:860px){.sidebar{position:static;height:auto;display:flex;gap:8px;overflow-x:auto;padding:12px}}
  .side-h{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.6px;padding:10px 14px 6px;text-transform:uppercase}
  @media(max-width:860px){.side-h{display:none}}
  .nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:#565b6b;font-weight:700;font-size:14.5px;white-space:nowrap;border:none;background:none;width:100%;text-align:left;transition:.12s}
  .nav-item .ni{font-size:18px;width:22px;text-align:center}
  .nav-item:hover{background:var(--card);color:var(--ink)}
  .nav-item.active{background:var(--pri);color:#fff;box-shadow:0 8px 20px rgba(108,92,231,.3)}

  .main{padding:28px 34px 70px;min-height:calc(100vh - 64px)}
  @media(max-width:640px){.main{padding:20px 16px 60px}}
  .page-head{margin-bottom:22px}
  .page-head h1{font-size:26px;font-weight:800;letter-spacing:-.4px}
  .page-head p{color:var(--sub);margin-top:6px;font-size:14.5px}
  .eyebrow{color:var(--pri);font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .btn{border:none;border-radius:11px;padding:11px 18px;font-weight:800;font-size:14px;background:var(--pri);color:#fff;transition:.12s}
  .btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .btn.ghost{background:#fff;color:var(--pri);border:1.5px solid var(--soft)}
  .btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
  .btn.gray{background:#EEF0F5;color:#6b7180}
  .chip-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 15px;font-size:13px;font-weight:700;color:var(--sub)}
  .chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
  .empty{color:var(--sub);text-align:center;padding:40px;font-size:14px}

  /* dashboard */
  .hero-band{border-radius:22px;padding:34px 36px;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));position:relative;overflow:hidden}
  .hero-band::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:rgba(255,255,255,.1);border-radius:50%}
  .hero-band h2{font-size:24px;font-weight:800;position:relative}
  .hero-band p{color:rgba(255,255,255,.9);margin-top:8px;position:relative;font-size:14.5px}
  .hero-band .slogan{margin-top:16px;display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:7px 15px;border-radius:20px;font-weight:700;font-size:13.5px;position:relative}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
  @media(max-width:640px){.kpis{grid-template-columns:1fr}}
  .kpi{padding:22px;text-align:left}
  .kpi .k-ic{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}
  .kpi .k-n{font-size:26px;font-weight:800}
  .kpi .k-l{color:var(--sub);font-size:13.5px;margin-top:2px}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  @media(max-width:860px){.dash-grid{grid-template-columns:1fr}}
  .panel{padding:22px}
  .panel h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .panel h3 .more{margin-left:auto;font-size:12.5px;color:var(--pri);font-weight:700;cursor:pointer}
  .mini-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .mini-row:first-of-type{border-top:none}
  .mini-row .mt{font-weight:700;font-size:14px}
  .mini-row .ms{color:var(--sub);font-size:12.5px;margin-top:2px}
  .date-chip{background:var(--soft);color:var(--pri);border-radius:11px;font-size:12px;font-weight:800;padding:8px 10px;text-align:center;min-width:52px;flex-shrink:0}

  /* posts */
  .post-card{padding:22px;margin-bottom:14px}
  .post-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .post-top .who{font-weight:800;font-size:14px}
  .post-top .meta{color:var(--sub);font-size:12.5px}
  .cat-tag{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:20px;background:var(--soft);color:var(--pri)}
  .cat-tag.deal{background:#FFF3E0;color:#C77700}
  .cat-tag.invest{background:#E7F6EE;color:#1E9E54}
  .cat-tag.hire{background:#E8EEFF;color:#3B5BDB}
  .cat-tag.info{background:#F0EEFB;color:#6C5CE7}
  .cat-tag.jokbo{background:#EAF6F0;color:#1E7F5C}
  .post-card h3{font-size:17px;font-weight:800}
  .post-card .body{color:#464c59;margin-top:8px;font-size:14.5px;white-space:pre-wrap}
  .post-actions{display:flex;gap:18px;margin-top:14px;color:var(--sub);font-size:13px;font-weight:700}
  .post-actions button{background:none;border:none;color:var(--sub);font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px}
  .post-actions button.on{color:var(--pri)}
  .comments{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .cmt{display:flex;gap:9px;font-size:13.5px;padding:5px 0}
  .cmt b{font-weight:800}
  .cmt-form{display:flex;gap:8px;margin-top:10px}
  .cmt-form input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;outline:none}
  .cmt-form input:focus{border-color:var(--pri)}

  /* meetups */
  .meet-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  @media(max-width:860px){.meet-grid{grid-template-columns:1fr}}
  .meet-card{padding:22px;display:flex;flex-direction:column}
  .meet-card .m-date{display:inline-flex;align-items:center;gap:8px;color:var(--pri);font-weight:800;font-size:13px}
  .meet-card h3{font-size:17px;font-weight:800;margin-top:10px}
  .meet-card .m-info{color:var(--sub);font-size:13px;margin-top:8px;display:flex;flex-direction:column;gap:4px}
  .meet-foot{display:flex;align-items:center;gap:12px;margin-top:16px}
  .attend{border:1.5px solid var(--green);color:var(--green);background:#fff;border-radius:11px;padding:9px 16px;font-weight:800;font-size:13.5px}
  .attend.going{background:var(--green);color:#fff}
  .cap-bar{flex:1;height:8px;background:#EEF0F5;border-radius:6px;overflow:hidden}
  .cap-bar i{display:block;height:100%;background:var(--pri)}
  .cap-txt{font-size:12.5px;color:var(--sub);font-weight:700}

  /* directory */
  .dir-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:1000px){.dir-grid{grid-template-columns:1fr 1fr}}
  @media(max-width:640px){.dir-grid{grid-template-columns:1fr}}
  .mem-card{padding:22px}
  .mem-top{display:flex;align-items:center;gap:14px}
  .mem-av{width:56px;height:56px;font-size:20px}
  .mem-nm{font-weight:800;font-size:16px}
  .mem-sub{color:var(--sub);font-size:12.5px;margin-top:2px}
  .mem-head{font-size:13px;color:#464c59;margin-top:3px;font-weight:600}
  .mem-sec{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .kv{display:flex;gap:8px;font-size:13px;padding:3px 0;align-items:flex-start}
  .kv .k{color:var(--sub);width:58px;flex-shrink:0;font-weight:600}
  .kv .v{color:#333a48;flex:1}
  .lock{color:var(--sub);font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
  .career-item{font-size:12.5px;color:#4a5160;padding:3px 0;display:flex;gap:8px}
  .career-item .cc{font-weight:700;color:#333a48}
  .career-item .cp{color:var(--sub);margin-left:auto;white-space:nowrap}
  .exch-line{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .badge-exp{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--soft);color:var(--pri)}
  .badge-exp.full{background:var(--green-s);color:#1E9E54}
  .badge-exp.minimal{background:#FBEAEA;color:#C0392B}
  .badge-off{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:8px;background:#FFF4D6;color:#B07A00;border:1px solid #F1D98A}
  .exchanged{color:var(--green);font-weight:800;font-size:12.5px}

  /* clubs */
  .club-card{padding:22px;text-align:center}
  .club-emoji{font-size:34px}
  .club-nm{font-weight:800;font-size:16px;margin-top:8px}
  .club-cat{color:var(--sub);font-size:12.5px;margin-top:3px}
  .club-desc{color:#4a5160;font-size:13px;margin-top:10px;min-height:38px}
  .club-tags{display:flex;flex-wrap:wrap;gap:6px}
  .club-chip{background:var(--soft);color:var(--pri);font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px}

  /* profile exposure */
  .exp-seg{display:flex;flex-direction:column;gap:10px}
  .exp-opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
  .exp-opt b{font-size:14.5px;font-weight:800}
  .exp-opt span{font-size:12.5px;color:var(--sub)}
  .exp-opt:hover{border-color:var(--pri)}
  .exp-opt.on{border-color:var(--pri);background:var(--soft)}
  .exp-opt.on b{color:var(--pri)}
  .career-row{display:grid;grid-template-columns:1fr 1fr 120px 34px;gap:8px;margin-bottom:8px;align-items:center}
  .career-row input{border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;font-size:13px;outline:none}
  .career-row input:focus{border-color:var(--pri)}
  .career-row .del{border:none;background:#F3EEF0;color:#C0392B;border-radius:8px;font-weight:800;font-size:16px;height:34px}
  @media(max-width:600px){.career-row{grid-template-columns:1fr 1fr;}.career-row .cp-in{grid-column:1/2}.career-row .del{grid-column:2/3;width:44px;justify-self:end}}
  .photo-edit{display:flex;align-items:center;gap:16px;margin-bottom:20px}
  .photo-big{width:76px;height:76px;font-size:28px}
  .photo-btns{display:flex;gap:8px}

  /* notices */
  .notice-row{padding:18px 22px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);cursor:pointer}
  .notice-row:last-child{border-bottom:none}
  .notice-row:hover{background:var(--bg)}
  .notice-row .src{font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px;background:var(--soft);color:var(--pri);flex-shrink:0}
  .notice-row .nt{font-weight:700;font-size:14.5px}
  .notice-row .nd{color:var(--sub);font-size:12px;margin-top:2px}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(20,18,31,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:28px}
  .modal h3{font-size:19px;font-weight:800;margin-bottom:16px}
  .modal .fld{margin-bottom:14px}
  .modal textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px;font-size:14px;outline:none;resize:vertical;min-height:110px;font-family:inherit}
  .modal textarea:focus{border-color:var(--pri)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}

  #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:12px;font-size:14px;font-weight:600;z-index:120;opacity:0;transition:.25s;pointer-events:none}
  #toast.show{opacity:1}

  /* 전체메뉴(햄버거) & 모바일 서브탭 — 데스크톱에서는 숨김 */
  .menu-btn{display:none;background:none;border:none;color:var(--ink);padding:6px;border-radius:10px}
  .nav-more{display:none}
  /* 게시판 계열 서브탭 — 데스크톱·모바일 공통 노출 (만남·미팅은 게시판 안으로) */
  .mob-subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
  .drawer-bg{position:fixed;inset:0;background:rgba(20,18,31,.45);z-index:90}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:80%;max-width:330px;background:#fff;z-index:95;
    box-shadow:-12px 0 34px rgba(0,0,0,.18);padding:0 0 calc(16px + env(safe-area-inset-bottom,0px));overflow:auto;
    border-radius:18px 0 0 18px;display:flex;flex-direction:column}
  .drawer .d-head{display:flex;align-items:center;gap:10px;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 14px;
    border-bottom:1px solid var(--line);font-weight:800;font-size:16px}
  .drawer .d-head .d-x{margin-left:auto;background:none;border:none;font-size:22px;color:var(--sub);padding:4px 8px}
  .drawer .d-sec{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.6px;text-transform:uppercase;padding:16px 20px 6px}

const FB_CONFIG={apiKey:"AIzaSyAIntjO670PutdCbHioPKIFjsBe8BvLmjQ",authDomain:"mba-lounge.firebaseapp.com",projectId:"mba-lounge",storageBucket:"mba-lounge.firebasestorage.app",messagingSenderId:"67240152331",appId:"1:67240152331:web:9f79729169eb9f1fa2a60e"};
let DB=null,FB_ON=false;
try{ if(FB_CONFIG.projectId && window.firebase){ firebase.initializeApp(FB_CONFIG); DB=firebase.firestore(); FB_ON=true; } }catch(e){ FB_ON=false; }
const MEMBERS='members';
async function fbGet(sid){const d=await DB.collection(MEMBERS).doc(sid).get();return d.exists?d.data():null;}
async function fbCreatePending(acc){await DB.collection(MEMBERS).doc(acc.sid).set(Object.assign({},acc,{status:'pending',createdAt:Date.now()}));}
async function fbListByStatus(st){const q=await DB.collection(MEMBERS).where('status','==',st).get();return q.docs.map(d=>d.data());}
async function fbSetStatus(sid,st){await DB.collection(MEMBERS).doc(sid).update({status:st});}
/* ---- 오류 로그 (Firestore errorLogs 컬렉션에 기록) ---- */
const ERRLOGS='errorLogs';
async function logError(kind,message,detail){
  if(!FB_ON||!DB)return;
  try{
    await DB.collection(ERRLOGS).add({
      kind:kind||'error',
      message:(''+(message||'')).slice(0,1000),
      detail:(''+(detail||'')).slice(0,3000),
      sid:(S.user&&S.user.sid)||S.session||'anon',
      name:(S.user&&S.user.name)||'',
      school:(S.user&&S.user.school)||'',
      url:location.href,
      ua:navigator.userAgent,
      ts:Date.now(),
      at:new Date().toISOString()
    });
  }catch(e){/* 로깅 실패는 무시 */}
}
async function fbRecentLogs(n){const q=await DB.collection(ERRLOGS).orderBy('ts','desc').limit(n||50).get();return q.docs.map(d=>({id:d.id,...d.data()}));}
async function fbClearLogs(){const q=await DB.collection(ERRLOGS).limit(400).get();const b=DB.batch();q.docs.forEach(d=>b.delete(d.ref));await b.commit();return q.size;}

let pickedSchool=null;
function buildLogin(){
  document.getElementById('login-mark').innerHTML=schoolMark(schools[0],32);
  const wrap=document.getElementById('loginSchools');
  wrap.innerHTML=schools.map(s=>`<button class="sch-chip" data-id="${s.id}">${schoolMark(s,22)}<span>${s.short}</span></button>`).join('');
  wrap.querySelectorAll('.sch-chip').forEach(b=>b.addEventListener('click',()=>{

    wrap.querySelectorAll('.sch-chip').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');applyTheme(pickedSchool);
    document.getElementById('login-mark').innerHTML=schoolMark(pickedSchool,32);
    document.getElementById('login-sub').textContent=pickedSchool.name+' MBA · '+(slogans[pickedSchool.name]||'라운지, 만남이 쉬워지는 공간');
  }));
  document.getElementById('tab-login').addEventListener('click',()=>switchTab('login'));
  document.getElementById('tab-signup').addEventListener('click',()=>switchTab('signup'));
  document.getElementById('loginBtn').addEventListener('click',doLogin);

  document.getElementById('lg-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}
function switchTab(t){
  document.getElementById('tab-login').classList.toggle('on',t==='login');
  document.getElementById('tab-signup').classList.toggle('on',t==='signup');
  document.getElementById('pane-login').classList.toggle('hidden',t!=='login');
  document.getElementById('pane-signup').classList.toggle('hidden',t!=='signup');
}
async function doLogin(){
  const sid=gv('lg-sid'),pw=document.getElementById('lg-pw').value;
  if(!sid){toast('학번을 입력하세요');return;}
  const local=acctBySid(sid);            // 데모·관리자·이미 로그인한 계정은 로컬 우선
  if(local){
    if(local.pw!==pw){toast('비밀번호가 올바르지 않습니다');return;}
    S.session=sid;S.remember=document.getElementById('lg-remember').checked;save();enterApp();return;
  }
  if(FB_ON){                              // 백엔드에 등록된 실제 가입자 확인
    let m=null;
    try{m=await fbGet(sid);}catch(e){toast('로그인 확인 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요');return;}
    if(!m){toast('등록되지 않은 학번입니다. 회원가입을 이용하세요');return;}
    if(m.status==='pending'){toast('아직 승인 대기 중입니다. 관리자 승인 후 이용해주세요');return;}
    if(m.status==='rejected'){toast('가입이 거절된 계정입니다. 관리자에게 문의하세요');return;}
    if(m.pw!==pw){toast('비밀번호가 올바르지 않습니다');return;}
    S.accounts.push(m);S.session=sid;S.remember=document.getElementById('lg-remember').checked;save();enterApp();return;
  }
  toast('등록되지 않은 학번입니다. 회원가입을 이용하세요');
}
async function doSignup(){
  if(!pickedSchool){toast('학교를 선택하세요');return;}
  const sid=gv('su-sid');
  const need=['su-sid','su-name','su-gisu','su-company','su-title','su-email'];
  if(!need.every(id=>gv(id))){toast('필수 항목(*)을 모두 입력하세요');return;}
  const acc={sid:sid,pw:gv('su-pw')||'1234',name:gv('su-name'),school:pickedSchool.name,gisu:gv('su-gisu'),course:'MBA',
    birth:gv('su-birth'),company:gv('su-company'),title:gv('su-title'),head:gv('su-head'),email:gv('su-email'),phone:gv('su-phone'),
    photo:'',career:[],clubs:[],officer:'',role:'member',exposure:'basic'};
  if(FB_ON){                              // 백엔드: 가입 신청 → 관리자 승인 대기
    if(acctBySid(sid)){toast('이미 등록된 학번입니다');return;}
    try{
      const ex=await fbGet(sid);
      if(ex){toast(ex.status==='pending'?'이미 승인 대기 중인 학번입니다':'이미 등록된 학번입니다');return;}
      await fbCreatePending(acc);
      toast('가입 신청이 접수되었습니다 — 관리자 승인 후 로그인할 수 있어요');
      switchTab('login');
    }catch(e){toast('가입 신청 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요');}
    return;
  }
  // 백엔드 미연결(데모): 즉시 가입·입장
  if(acctBySid(sid)){toast('이미 등록된 학번입니다');return;}
  S.accounts.push(acc);S.session=sid;S.remember=true;save();enterApp();
}

    <button class="d-out" id="drawerOut">로그아웃</button>`;

  dr.querySelector('#drawerX').onclick=closeMenuDrawer;

function closeMenuDrawer(){['drawerBg','drawer'].forEach(id=>{const e=document.getElementById(id);if(e)e.remove();});}
let currentView='home';
const BOARD_FAMILY=['board','meet','notice'];
function go(v){currentView=v;
  const isMob=window.matchMedia('(max-width:860px)').matches;
  document.querySelectorAll('.nav-item').forEach(b=>{
    let on=b.dataset.view===v;
    if(b.dataset.view==='board'&&(v==='meet'||(isMob&&BOARD_FAMILY.includes(v))))on=true;
    b.classList.toggle('active',on);
  });
  const m=document.getElementById('main');window.scrollTo(0,0);
  ({home:viewHome,board:viewBoard,meet:viewMeet,dir:viewDir,club:viewClub,notice:viewNotice,officer:viewOfficer,jokbo:viewJokboHome,signups:viewSignups,officeradmin:viewOfficerAdmin,logs:viewLogs,me:viewMe}[v]||viewHome)(m);
  /* 모바일: 게시판 계열 화면 상단에 서브탭(게시판·만남·공지·임원) 노출 */
  if(BOARD_FAMILY.includes(v)){
    const bar=document.createElement('div');bar.className='mob-subtabs';
    const names={board:'BZ 게시판',meet:'만남 · 미팅',notice:'공지'};
    bar.innerHTML=BOARD_FAMILY.map(x=>`<button class="chip${x===v?' on':''}" data-view="${x}">${names[x]}</button>`).join('');
    bar.querySelectorAll('.chip').forEach(c=>c.onclick=()=>go(c.dataset.view));
    m.prepend(bar);
  }
}

/* ---- 족보: 수업(클래스)별로 여러 원우가 꼬리에 꼬리를 물고 기록 + 수업 만족도 ---- */

function jokboAvg(j){const r=j.ratings||{};const vals=Object.values(r);return {v:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0,n:vals.length};}
function viewJokboHome(m){
  if(!S.jokbo)S.jokbo=[];

    <div class="page-head" style="display:flex;align-items:flex-end;justify-content:space-between">
      <div><div class="eyebrow">Jokbo</div><h1>족보</h1><p>수업(클래스)별로 원우들이 꼬리에 꼬리를 물고 기록을 이어갑니다. 수업 만족도(★)도 남겨보세요!</p></div>

        <div style="margin-top:6px">${starHTML(avg.v)} <span style="font-size:12px;color:var(--sub);font-weight:700">${avg.n?avg.v.toFixed(1)+' ('+avg.n+'명)':'첫 만족도를 남겨보세요'}</span></div>

        <button class="btn sm openJ" data-id="${j.id}" style="margin-top:12px;width:100%">${ico('book',14)} 족보 열기 · 이어쓰기</button></div>`;}).join('')||'<div class="empty">등록된 수업이 없습니다.<br>수업을 추가해 첫 족보를 시작하세요!</div>'}</div>`;

function postHTML(p){
  return `<div class="post-card card" data-id="${p.id}">
    <div class="post-top">${avatarHTML({name:p.who},40)}
      <div style="flex:1"><div class="who">${esc(p.who)}</div><div class="meta">${esc(p.co)} · ${p.date}</div></div>

      <button class="like ${p.liked?'on':''}" data-id="${p.id}">${ico('heart',15)} <span>${p.likes}</span></button>

    <div class="comments">
      ${p.comments.map(c=>`<div class="cmt"><b>${esc(c.by)}</b><span>${esc(c.txt)}</span></div>`).join('')}

}
function bindPost(m){
  m.querySelectorAll('.like').forEach(b=>b.addEventListener('click',()=>{const p=S.posts.find(x=>x.id===b.dataset.id);p.liked=!p.liked;p.likes+=p.liked?1:-1;save();b.classList.toggle('on',p.liked);b.querySelector('span').textContent=p.likes;}));
  m.querySelectorAll('.cadd').forEach(b=>b.addEventListener('click',()=>{const inp=m.querySelector('.cmt-form input[data-id="'+b.dataset.id+'"]');const t=inp.value.trim();if(!t)return;const p=S.posts.find(x=>x.id===b.dataset.id);p.comments.push({by:S.user.name,txt:t});save();viewBoard(m);}));
}
function newPost(){
  const fixed=(boardCat!=='all');/* 선택된 카테고리 탭에서 글쓰기 → 그 카테고리로 바로 작성 */

      S.posts.unshift({id:'p'+Date.now(),cat:cat,who:S.user.name,

/* ---------- DIRECTORY (원우수첩) ---------- */
let dirScope='mine';
const EXP={full:{protect:[]},basic:{protect:['phone','birth']},minimal:{protect:['phone','birth','career']}};
function isProtected(exp,f){return (EXP[exp]||EXP.basic).protect.includes(f);}
function realMembers(){return S.accounts.filter(a=>!a.system);}
function viewDir(m){
  const mine=S.user.school;
  const list=realMembers().filter(x=>x.sid!==S.user.sid&&(dirScope==='all'||x.school===mine));
  m.innerHTML=`
    <div class="page-head"><div class="eyebrow">Directory</div><h1>원우수첩</h1><p>원우와 연락처를 교환하고 사업·커리어로 연결되세요. 각 원우가 설정한 공개 범위에 따라 보이는 정보가 달라집니다.</p></div>
    <div class="chip-row">
      <button class="chip ${dirScope==='mine'?'on':''}" data-s="mine">우리 학교</button>
      <button class="chip ${dirScope==='all'?'on':''}" data-s="all">전국 원우</button></div>
    <div class="dir-grid">${list.map(memHTML).join('')||'<div class="empty">표시할 원우가 없습니다.</div>'}</div>`;
  m.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{dirScope=c.dataset.s;viewDir(m);}));
  m.querySelectorAll('.exch').forEach(b=>b.addEventListener('click',()=>{const key=b.dataset.k;
    if(!S.exchanged.includes(key)){S.exchanged.push(key);save();}viewDir(m);toast('연락처를 교환했습니다');}));
}
function memHTML(x){
  const key=x.sid,done=S.exchanged.includes(key),ss=schoolByName(x.school),exp=x.exposure||'basic';
  const canSee=f=>!isProtected(exp,f)||done;
  const expBadge=exp==='full'?'<span class="badge-exp full">전체 공개</span>':(exp==='minimal'?'<span class="badge-exp minimal">최소 공개</span>':'<span class="badge-exp">기본</span>');
  let rows=`<div class="kv"><span class="k">학번</span><span class="v">${esc(x.sid)}</span></div>
    <div class="kv"><span class="k">이메일</span><span class="v">${esc(x.email)}</span></div>
    <div class="kv"><span class="k">생년월일</span><span class="v">${canSee('birth')?(esc(x.birth)||'—'):('<span class="lock">'+ico('lock',13)+' 교환 후 공개</span>')}</span></div>
    <div class="kv"><span class="k">연락처</span><span class="v">${canSee('phone')?(esc(x.phone)||'—'):('<span class="lock">'+ico('lock',13)+' 교환 후 공개</span>')}</span></div>`;
  let careerHTML=canSee('career')?((x.career&&x.career.length)?x.career.map(c=>`<div class="career-item"><span class="cc">${esc(c.c)}</span> ${esc(c.r)}<span class="cp">${esc(c.p)}</span></div>`).join(''):'<div class="lock">이력 없음</div>'):('<div class="lock">'+ico('lock',13)+' 교환 후 공개</div>');
  const needExch=(!done)&&(EXP[exp].protect.length>0);
  return `<div class="mem-card card">
    <div class="mem-top">${avatarHTML(x,56,'mem-av')}
      <div style="flex:1"><div class="mem-nm">${esc(x.name)} ${x.officer?`<span class="badge-off">${ico('star',11)} ${esc(x.officer)}</span>`:''} ${expBadge}</div>
        <div class="mem-sub">${ss?ss.short:''} · ${esc(x.course)} ${x.gisu}기</div>
        <div class="mem-head">${esc(x.company)} · ${esc(x.title)}</div>
        ${x.head?`<div class="mem-sub" style="margin-top:3px">“${esc(x.head)}”</div>`:''}</div></div>
    <div class="mem-sec">${rows}</div>
    <div class="mem-sec"><div style="font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px">소속 동아리</div>${(x.clubs&&x.clubs.length)?`<div class="club-tags">${x.clubs.map(c=>`<span class="club-chip">${esc(c)}</span>`).join('')}</div>`:'<div class="lock">없음</div>'}</div>
    <div class="mem-sec"><div style="font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px">이력</div>${careerHTML}</div>
    ${needExch?`<div class="exch-line"><button class="btn sm exch" data-k="${key}">연락처 교환</button><span class="lock">교환하면 잠긴 정보가 공개됩니다</span></div>`:(done?('<div class="exch-line"><span class="exchanged">'+ico('check',13)+' 연락처 교환 완료</span></div>'):'')}
  </div>`;
}

/* ---------- CLUBS ---------- */
function clubIcHTML(c){return c.icon?`<div class="club-ic" style="background-image:url('${c.icon}');background-size:cover;background-position:center"></div>`:`<div class="club-ic">${ico(catIcon(c.cat),26)}</div>`;}
let clubScope='school';
function clubScopeLabel(c){if(c.scope==='school'){const s=schoolByName(c.school);return (s?s.short:'학교')+' 동아리';}return '전체 MBA';}
function viewClub(m){
  const mine=S.user.clubs||[];
  if(!S.clubPosts)S.clubPosts={};

    <div class="page-head" style="display:flex;align-items:flex-end;justify-content:space-between">
      <div><div class="eyebrow">Clubs</div><h1>동아리</h1><p>우리 학교 동아리와 전체 MBA 연합 동아리로 나뉩니다. 가입하면 동아리방(소식·게시판)을 이용할 수 있어요.</p></div>

      <button class="chip ${clubScope==='all'?'on':''}" data-s="all">전체 MBA</button></div>
    ${(S.clubRequests||[]).filter(r=>r.bySid===S.user.sid&&r.status==='pending').map(r=>`<div class="card" style="padding:12px 18px;margin-bottom:12px;font-size:13px;color:var(--sub)">${ico('lock',13)} 「${esc(r.name)}」 개설 신청이 관리자 승인 대기 중입니다.</div>`).join('')}
    ${mine.length?`<div style="margin-bottom:18px"><div style="font-size:12px;font-weight:800;color:var(--sub);margin-bottom:8px">내 소속 동아리</div><div class="club-tags">${mine.map(c=>`<span class="club-chip">${esc(c)}</span>`).join('')}</div></div>`:''}
    <div class="dir-grid">${list.map(c=>{const j=mine.includes(c.name);return `
      <div class="club-card card"><div class="crOpen" data-c="${esc(c.name)}" style="cursor:pointer" title="${j?'동아리방 입장':'가입 후 이용 가능'}">${clubIcHTML(c)}</div><div class="club-nm">${esc(c.name)}</div>
        <div class="club-cat">${clubScopeLabel(c)} · ${esc(c.cat)} · 멤버 ${c.members+(j?1:0)}명</div><div class="club-desc">${esc(c.desc)}</div>
        ${j?`<button class="btn sm room" data-c="${esc(c.name)}" style="margin-top:14px;width:100%">${ico('comment',14)} 동아리방 입장</button>`:''}
        <button class="btn ${j?'gray':''} sm join" data-c="${esc(c.name)}" style="margin-top:${j?'8px':'14px'};width:100%">${j?ico('check',13)+' 가입됨 · 탈퇴하기':ico('plus',15)+' 가입하기'}</button>
        <button class="ic-change" data-c="${esc(c.name)}" style="margin-top:8px;background:none;border:none;color:var(--sub);font-size:12px;font-weight:600;width:100%;cursor:pointer">${ico('camera',13)} 아이콘 변경</button></div>`;}).join('')||`<div class="empty">아직 ${clubScope==='school'?'우리 학교':'전체 MBA'} 동아리가 없습니다.<br>첫 동아리를 만들어보세요!</div>`}</div>
    <input type="file" id="clubIconInput" accept="image/*" hidden>`;
  m.querySelectorAll('.chip-row .chip').forEach(c=>c.addEventListener('click',()=>{clubScope=c.dataset.s;viewClub(m);}));

    if((S.user.clubs||[]).includes(b.dataset.c))viewClubRoom(m,b.dataset.c);
    else toast('가입하면 동아리방을 이용할 수 있어요');}));

  let targetClub=null;const fi=m.querySelector('#clubIconInput');

  m.querySelector('#newClub').addEventListener('click',newClub);

/* 동아리방 — 공지사항 · 게시판 · 사진첩 · 회원 목록 · 회계 현황 */
function clubRoom(name){
  if(!S.clubRooms)S.clubRooms={};
  if(!S.clubRooms[name])S.clubRooms[name]={notices:[],posts:(S.clubPosts&&S.clubPosts[name])||[],photos:[],ledger:[]};
  const r=S.clubRooms[name];
  ['notices','posts','photos','ledger'].forEach(k=>{if(!r[k])r[k]=[];});
  return r;
}
function won(n){return (n<0?'-':'')+Math.abs(n).toLocaleString('ko-KR')+'원';}
let crTab='notice';
function viewClubRoom(m,name,tab){
  const c=S.clubs.find(x=>x.name===name);if(!c){go('club');return;}
  const joined=(S.user.clubs||[]).includes(name);
  if(tab)crTab=tab;
  const r=clubRoom(name);
  const T=[['notice','공지사항','bell'],['post','게시판','comment'],['photo','사진첩','camera'],['member','회원 목록','users'],['ledger','회계 현황','trend']];
  let body='';
  if(crTab==='notice'){
    body=`${joined?`<button class="btn sm" id="crAddNotice" style="margin-bottom:14px">${ico('plus',14)} 공지 올리기</button>`:''}
      ${r.notices.map(p=>`<div class="post-card card"><div class="post-top">${avatarHTML({name:p.by},40)}
        <div style="flex:1"><div class="who">${esc(p.by)} <span class="badge-off">${ico('bell',11)} 공지</span></div><div class="meta">${p.date}</div></div></div>
        <h3>${esc(p.title)}</h3><div class="body">${esc(p.body)}</div></div>`).join('')||'<div class="empty">아직 공지가 없습니다.</div>'}`;
  }else if(crTab==='post'){
    body=`${joined?`<button class="btn sm" id="crAddPost" style="margin-bottom:14px">${ico('plus',14)} 글쓰기</button>`:''}
      ${r.posts.map(p=>`<div class="post-card card"><div class="post-top">${avatarHTML({name:p.by},40)}
        <div style="flex:1"><div class="who">${esc(p.by)}</div><div class="meta">${p.date}</div></div></div>
        <h3>${esc(p.title)}</h3><div class="body">${esc(p.body)}</div></div>`).join('')||'<div class="empty">아직 게시글이 없습니다. 첫 글을 남겨보세요!</div>'}`;
  }else if(crTab==='photo'){
    body=`${joined?`<button class="btn sm" id="crAddPhoto" style="margin-bottom:14px">${ico('camera',14)} 사진 올리기</button><input type="file" id="crPhotoFile" accept="image/*" hidden>`:''}
      ${r.photos.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">
        ${r.photos.map(p=>`<div class="card" style="overflow:hidden"><div style="height:140px;background-image:url('${p.src}');background-size:cover;background-position:center"></div>
          <div style="padding:8px 10px;font-size:11.5px;color:var(--sub)">${esc(p.by)} · ${p.date}</div></div>`).join('')}</div>`
        :'<div class="empty">아직 사진이 없습니다. 모임 사진을 올려보세요! 📷</div>'}`;
  }else if(crTab==='member'){
    const mem=realMembers().filter(x=>(x.clubs||[]).includes(name));
    body=`<div class="card" style="padding:6px 20px">
      ${mem.map(x=>`<div class="mini-row">${avatarHTML(x,40)}
        <div style="flex:1"><div class="mt">${esc(x.name)} ${x.officer?`<span class="badge-off">${ico('star',11)} ${esc(x.officer)}</span>`:''}</div>
          <div class="ms">${esc(x.company)} · ${esc(x.title)}</div></div>
        <span class="ms">${(schoolByName(x.school)||{}).short||''} ${x.gisu}기</span></div>`).join('')||'<div class="empty">아직 회원이 없습니다.</div>'}</div>`;
  }else if(crTab==='ledger'){
    const inc=r.ledger.filter(l=>l.type==='in').reduce((a,b)=>a+b.amount,0);
    const out=r.ledger.filter(l=>l.type==='out').reduce((a,b)=>a+b.amount,0);
    const bal=inc-out;
    body=`
      <div class="kpis" style="margin-top:0">
        <div class="kpi card"><div class="k-ic">${ico('trend',22)}</div><div class="k-n" style="color:var(--green)">+${won(inc)}</div><div class="k-l">총 수입</div></div>
        <div class="kpi card"><div class="k-ic">${ico('tag',22)}</div><div class="k-n" style="color:#C0392B">-${won(out)}</div><div class="k-l">총 지출</div></div>
        <div class="kpi card"><div class="k-ic">${ico('award',22)}</div><div class="k-n">${won(bal)}</div><div class="k-l">현재 잔액</div></div></div>
      ${joined?`<button class="btn sm" id="crAddLedger" style="margin:14px 0">${ico('plus',14)} 내역 추가</button>`:''}

          <b style="font-size:14.5px;color:${l.type==='out'?'#C0392B':'var(--green)'}">${l.type==='out'?'-':'+'}${won(l.amount)}</b></div>`).join('')||'<div class="empty">아직 회계 내역이 없습니다.<br>회비·지출 내역을 기록해 투명하게 운영해 보세요.</div>'}</div>`;
  }
  m.innerHTML=`
    <div class="page-head" style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:14px">${clubIcHTML(c)}
        <div><div class="eyebrow">Club Room</div><h1>${esc(name)}</h1><p>${clubScopeLabel(c)} · ${esc(c.cat)} · ${esc(c.desc)}</p></div></div>
      <button class="btn gray sm" id="crBack">← 동아리 목록</button></div>
    ${joined?'':`<div class="card" style="padding:16px 20px;margin-bottom:14px;color:var(--sub);font-size:13.5px">${ico('lock',14)} 가입하면 공지·게시판·사진첩·회계에 참여할 수 있습니다.</div>`}

  m.querySelectorAll('.chip-row .chip').forEach(b=>b.onclick=()=>viewClubRoom(m,name,b.dataset.t));
  const bind=(id,fn)=>{const e=m.querySelector(id);if(e)e.onclick=fn;};

    ()=>{const t=val('cn-t');if(!t){toast('제목을 입력하세요');return false;}
      r.notices.unshift({by:S.user.name,date:today(),title:t,body:val('cn-b')});save();viewClubRoom(m,name);toast('공지가 등록되었습니다');}));
  bind('#crAddPost',()=>openModal(name+' 글쓰기',
    `<div class="fld"><label>제목</label><input id="cr-t" placeholder="제목"></div><div class="fld"><label>내용</label><textarea id="cr-b" placeholder="동아리 원우들과 나눌 이야기"></textarea></div>`,
    ()=>{const t=val('cr-t');if(!t){toast('제목을 입력하세요');return false;}

  const pf=m.querySelector('#crPhotoFile');
  bind('#crAddPhoto',()=>{if(pf){pf.value='';pf.click();}});
  if(pf)pf.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{r.photos.unshift({src:rd.result,by:S.user.name,date:today()});save();viewClubRoom(m,name);toast('사진이 올라갔습니다 📷');};rd.readAsDataURL(f);});
  bind('#crAddLedger',()=>openModal(name+' 회계 내역 추가',
    `<div class="fld"><label>구분</label><select id="cl-type"><option value="in">수입 (회비·후원 등)</option><option value="out">지출 (모임비·경비 등)</option></select></div>
     <div class="fld"><label>금액 (원) <span class="req">*</span></label><input id="cl-amt" type="number" placeholder="예: 50000"></div>

/* 가입 승인 큐 — 임원방·관리자 화면 공용 */
async function renderSignupQueue(w,refresh){
  if(!FB_ON){w.innerHTML='<div class="ms" style="color:var(--sub)">백엔드(Firebase)가 아직 연결되지 않았습니다.</div>';return;}
  let pend=[];
  try{pend=await fbListByStatus('pending');}catch(e){w.innerHTML='<div class="ms" style="color:var(--sub)">목록을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</div>';return;}
  if(!pend.length){w.innerHTML='<div class="ms" style="color:var(--sub)">승인 대기 중인 가입 신청이 없습니다.</div>';return;}
  w.innerHTML=`<div style="font-weight:800;margin-bottom:12px">승인 대기 · ${pend.length}명</div>`+pend.map(p=>`<div class="mini-row"><div style="flex:1"><div class="mt">${esc(p.name)} · ${esc(p.sid)}</div><div class="ms">${esc(schoolByName(p.school)?schoolByName(p.school).short:p.school)} ${esc(p.gisu)}기 · ${esc(p.company)} ${esc(p.title)} · ${esc(p.email)}</div></div><button class="btn sm suok" data-k="${esc(p.sid)}">승인</button> <button class="btn sm gray surej" data-k="${esc(p.sid)}">거절</button></div>`).join('');
  w.querySelectorAll('.suok').forEach(b=>b.addEventListener('click',async()=>{try{await fbSetStatus(b.dataset.k,'approved');toast('승인했습니다');refresh();}catch(e){toast('처리 중 오류가 발생했습니다');}}));
  w.querySelectorAll('.surej').forEach(b=>b.addEventListener('click',async()=>{try{await fbSetStatus(b.dataset.k,'rejected');toast('거절했습니다');refresh();}catch(e){toast('처리 중 오류가 발생했습니다');}}));
}
async function viewLogs(m){
  if(S.user.role!=='admin'){m.innerHTML='<div class="empty">관리자만 접근할 수 있습니다.</div>';return;}
  m.innerHTML=`<div class="page-head" style="display:flex;align-items:flex-end;justify-content:space-between">
      <div><div class="eyebrow">Admin</div><h1>오류 로그</h1><p>앱에서 발생한 오류가 최신순으로 기록됩니다. (최근 50건)</p></div>
      <div><button class="btn gray sm" id="logReload">${ico('search',13)} 새로고침</button> <button class="btn gray sm" id="logClear">전체 삭제</button></div></div>
    <div id="logWrap" class="card" style="padding:20px"><div class="ms" style="color:var(--sub)">불러오는 중…</div></div>`;
  const w=document.getElementById('logWrap');
  document.getElementById('logReload').onclick=()=>viewLogs(m);
  document.getElementById('logClear').onclick=async()=>{if(!confirm('오류 로그를 모두 삭제할까요?'))return;try{await fbClearLogs();toast('로그를 삭제했습니다');viewLogs(m);}catch(e){toast('삭제 중 오류가 발생했습니다');}};
  if(!FB_ON){w.innerHTML='<div class="ms" style="color:var(--sub)">백엔드(Firebase)가 연결되지 않아 로그를 기록/조회할 수 없습니다.</div>';return;}
  let logs=[];
  try{logs=await fbRecentLogs(50);}catch(e){w.innerHTML='<div class="ms" style="color:var(--sub)">로그를 불러오지 못했습니다.</div>';return;}
  if(!logs.length){w.innerHTML='<div class="ms" style="color:var(--sub)">기록된 오류가 없습니다. 👍</div>';return;}
  w.innerHTML=logs.map(l=>{const d=new Date(l.ts||Date.parse(l.at)||Date.now());const ds=d.toLocaleString('ko-KR');
    return `<div style="border-bottom:1px solid var(--line);padding:12px 0">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="badge-off" style="background:#FEECEC;color:#D14343">${esc(l.kind||'error')}</span>
        <span style="font-weight:700;font-size:13.5px">${esc(l.message||'(메시지 없음)')}</span></div>
      <div class="ms" style="color:var(--sub);margin-top:4px">${ds} · ${esc(l.name||'')} ${esc(l.sid||'')} · ${esc(l.school||'')}</div>
      ${l.detail?`<pre style="white-space:pre-wrap;word-break:break-all;background:#F7F8FB;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:11.5px;color:#4a4f5b;max-height:120px;overflow:auto">${esc(l.detail)}</pre>`:''}
      <div class="ms" style="color:#b8bcc6;font-size:11px;margin-top:2px">${esc(l.ua||'')}</div></div>`;}).join('');
}

function expTitle(e){return {full:'전체 공개',basic:'기본 (권장)',minimal:'최소 공개'}[e];}
function expDesc(e){return {full:'연락처·생년월일·이력까지 모두 공개',basic:'이력은 공개, 연락처·생년월일은 연락처 교환 후 공개',minimal:'이름·학교·회사 등 필수 정보만, 연락처·생년월일·이력은 교환 후 공개'}[e];}
function myPreviewCard(){const u=S.user,ss=schoolByName(u.school),exp=u.exposure||'basic';
  const canSee=f=>!isProtected(exp,f);const lock=('<span class="lock">'+ico('lock',13)+' 교환 후 공개</span>');
  let rows=`<div class="kv"><span class="k">학번</span><span class="v">${esc(u.sid)||'—'}</span></div>
    <div class="kv"><span class="k">이메일</span><span class="v">${esc(u.email)||'—'}</span></div>
    <div class="kv"><span class="k">생년월일</span><span class="v">${canSee('birth')?(esc(u.birth)||'—'):lock}</span></div>
    <div class="kv"><span class="k">연락처</span><span class="v">${canSee('phone')?(esc(u.phone)||'—'):lock}</span></div>`;
  let career=canSee('career')?((u.career&&u.career.length)?u.career.map(c=>`<div class="career-item"><span class="cc">${esc(c.c)}</span> ${esc(c.r)}<span class="cp">${esc(c.p)}</span></div>`).join(''):'<div class="lock">이력 없음</div>'):('<div class="lock">'+ico('lock',13)+' 교환 후 공개</div>');
  return `<div class="mem-card card" style="max-width:340px">
    <div class="mem-top">${avatarHTML(u,56,'mem-av')}
      <div style="flex:1"><div class="mem-nm">${esc(u.name)||'나'} ${u.officer?`<span class="badge-off">${ico('star',11)} ${esc(u.officer)}</span>`:''}</div>
        <div class="mem-sub">${ss?ss.short:''} · ${esc(u.course)} ${u.gisu}기</div>
        <div class="mem-head">${esc(u.company)} · ${esc(u.title)}</div></div></div>
    <div class="mem-sec">${rows}</div>
    <div class="mem-sec"><div style="font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px">소속 동아리</div>${(u.clubs&&u.clubs.length)?`<div class="club-tags">${u.clubs.map(c=>`<span class="club-chip">${esc(c)}</span>`).join('')}</div>`:'<div class="lock">없음 · 동아리 메뉴에서 가입</div>'}</div>
    <div class="mem-sec"><div style="font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px">이력</div>${career}</div></div>`;
}
let editCareer=[];
function viewMe(m){const s=schoolByName(S.user.school)||schools[0];const u=S.user;
  editCareer=(u.career||[]).map(c=>({...c}));
  m.innerHTML=`<div class="page-head"><div class="eyebrow">Profile</div><h1>내 프로필</h1></div>
    <div class="card" style="padding:28px;max-width:620px">
      <div class="photo-edit">
        <span id="me-av" class="avatar photo-big" style="width:76px;height:76px;font-size:28px"></span>
        <div><div style="font-size:20px;font-weight:800">${esc(u.name)} ${u.officer?`<span class="badge-off">${ico('star',11)} ${esc(u.officer)}</span>`:''}</div>
          <div style="color:var(--sub);font-size:13px;margin:4px 0 8px">${s.short} · ${esc(u.course)} ${u.gisu}기 · 학번 ${esc(u.sid)}</div>
          <div class="photo-btns"><button class="btn sm ghost" id="btn-photo">${ico('camera',15)} 사진 변경</button><button class="btn sm gray" id="btn-photo-del">삭제</button></div>
          <input type="file" id="me-photo" accept="image/*" hidden></div>
        <span style="margin-left:auto">${schoolMark(s,40)}</span>
      </div>
      <div class="fields">
        <div class="fld"><label>현재 회사 <span class="req">*</span></label><input id="me-co" value="${esc(u.company)}"></div>
        <div class="fld"><label>직책 <span class="req">*</span></label><input id="me-ti" value="${esc(u.title)}"></div>
        <div class="fld full"><label>한 줄 소개</label><input id="me-head" value="${esc(u.head)}"></div>
        <div class="fld"><label>이메일 <span class="req">*</span></label><input id="me-em" value="${esc(u.email)}"></div>
        <div class="fld"><label>연락처</label><input id="me-ph" value="${esc(u.phone)}"></div>
        <div class="fld"><label>생년월일</label><input id="me-bd" value="${esc(u.birth)}" placeholder="예: 1985-03-12"></div>
        <div class="fld"><label>비밀번호 변경</label><input id="me-pw" value="${esc(u.pw)}"></div>
      </div>
      <div style="margin-top:18px;display:flex;gap:10px"><button class="btn" id="me-save">기본 정보 저장</button><button class="btn gray" id="me-out">로그아웃</button></div>
    </div>
    <div class="card" style="padding:28px;max-width:620px;margin-top:16px">
      <div style="font-weight:800;font-size:16px">이력 (경력)</div>
      <p style="color:var(--sub);font-size:13px;margin-top:4px;margin-bottom:14px">과거 회사·역할·기간을 추가하세요. (선택 · 공개 범위 설정의 영향을 받습니다)</p>
      <div id="careerList"></div>
      <button class="btn ghost sm" id="addCareer">${ico('plus',15)} 경력 추가</button>
      <div style="margin-top:16px"><button class="btn" id="saveCareer">이력 저장</button></div>
    </div>
    <div class="card" style="padding:28px;max-width:620px;margin-top:16px">
      <div style="font-weight:800;font-size:16px">개인정보 공개 범위</div>
      <p style="color:var(--sub);font-size:13.5px;margin-top:4px;margin-bottom:16px">학번·이름·회사·직책·이메일은 항상 공개됩니다. 아래에서 <b>연락처·생년월일·이력</b>의 공개 정도를 선택하세요.</p>
      <div class="exp-seg">${['full','basic','minimal'].map(e=>`<button class="exp-opt ${(u.exposure||'basic')===e?'on':''}" data-e="${e}"><b>${expTitle(e)}</b><span>${expDesc(e)}</span></button>`).join('')}</div>
      <div style="margin-top:20px"><div style="font-weight:700;font-size:13px;color:var(--sub);margin-bottom:10px">${ico('eye',15)} 다른 원우에게 보이는 내 카드 미리보기</div><div id="prevBox">${myPreviewCard()}</div></div>
    </div>`;
  renderMeAvatar(m);renderCareerEditor(m);
  m.querySelector('#btn-photo').addEventListener('click',()=>m.querySelector('#me-photo').click());
  m.querySelector('#me-photo').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{u.photo=rd.result;save();renderMeAvatar(m);document.getElementById('meAv').style.backgroundImage=`url('${u.photo}')`;document.getElementById('meAv').style.color='transparent';document.getElementById('meAv').textContent='';m.querySelector('#prevBox').innerHTML=myPreviewCard();toast('프로필 사진이 변경되었습니다');};rd.readAsDataURL(f);});
  m.querySelector('#btn-photo-del').addEventListener('click',()=>{u.photo='';save();renderMeAvatar(m);const a=document.getElementById('meAv');a.style.backgroundImage='';a.style.color='';a.textContent=u.name.slice(0,1);m.querySelector('#prevBox').innerHTML=myPreviewCard();toast('사진을 삭제했습니다');});
  m.querySelector('#addCareer').addEventListener('click',()=>{editCareer.push({c:'',r:'',p:''});renderCareerEditor(m);});
  m.querySelector('#saveCareer').addEventListener('click',()=>{u.career=editCareer.filter(c=>c.c.trim()||c.r.trim());save();m.querySelector('#prevBox').innerHTML=myPreviewCard();toast('이력이 저장되었습니다');});
  m.querySelector('#me-save').addEventListener('click',()=>{u.company=val('me-co');u.title=val('me-ti');u.head=val('me-head');u.email=val('me-em');u.phone=val('me-ph');u.birth=val('me-bd');u.pw=val('me-pw')||'1234';save();m.querySelector('#prevBox').innerHTML=myPreviewCard();toast('저장되었습니다');});
  m.querySelector('#me-out').addEventListener('click',()=>{if(confirm('로그아웃하시겠어요?')){S.session=null;save();location.reload();}});
  m.querySelectorAll('.exp-opt').forEach(b=>b.addEventListener('click',()=>{u.exposure=b.dataset.e;save();
    m.querySelectorAll('.exp-opt').forEach(o=>o.classList.toggle('on',o.dataset.e===u.exposure));
    m.querySelector('#prevBox').innerHTML=myPreviewCard();toast('공개 범위: '+expTitle(u.exposure));}));
}
function renderMeAvatar(m){const u=S.user;const a=m.querySelector('#me-av');a.style.cssText='width:76px;height:76px;font-size:28px;'+(u.photo?`background-image:url('${u.photo}');color:transparent;`:'');a.textContent=u.photo?'':u.name.slice(0,1);}
function renderCareerEditor(m){
  const box=m.querySelector('#careerList');
  box.innerHTML=editCareer.map((c,i)=>`<div class="career-row">
    <input data-i="${i}" data-f="c" value="${esc(c.c)}" placeholder="회사명">
    <input data-i="${i}" data-f="r" value="${esc(c.r)}" placeholder="역할/직책">
    <input class="cp-in" data-i="${i}" data-f="p" value="${esc(c.p)}" placeholder="기간 예:2015–2020">
    <button class="del" data-i="${i}">×</button></div>`).join('')||'<p style="color:var(--sub);font-size:13px;margin-bottom:10px">등록된 경력이 없습니다.</p>';
  box.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',()=>{editCareer[inp.dataset.i][inp.dataset.f]=inp.value;}));
  box.querySelectorAll('.del').forEach(b=>b.addEventListener('click',()=>{editCareer.splice(b.dataset.i,1);renderCareerEditor(m);}));
}

/* ---------- search ---------- */
function doSearch(q){q=q.trim();if(!q)return;
  const posts=S.posts.filter(p=>(p.title+p.body+p.who).includes(q));
  const mem=realMembers().filter(x=>(x.name+x.company+x.title+x.sid).includes(q));
  const meets=S.meets.filter(x=>(x.title+x.place+x.org).includes(q));
  openModal('“'+esc(q)+'” 검색 결과',`
    <p style="font-weight:800;margin:6px 0 6px">${ico('briefcase',15)} 게시글 ${posts.length}</p>${posts.map(p=>`<div class="cmt"><b>${esc(p.who)}</b><span>${esc(p.title)}</span></div>`).join('')||'<div style="color:var(--sub);font-size:13px">없음</div>'}
    <p style="font-weight:800;margin:14px 0 6px">${ico('idcard',15)} 원우 ${mem.length}</p>${mem.map(x=>`<div class="cmt"><b>${esc(x.name)}</b><span>${esc(x.company)} ${esc(x.title)}</span></div>`).join('')||'<div style="color:var(--sub);font-size:13px">없음</div>'}
    <p style="font-weight:800;margin:14px 0 6px">${ico('users',15)} 모임 ${meets.length}</p>${meets.map(x=>`<div class="cmt"><b>${esc(x.date)}</b><span>${esc(x.title)}</span></div>`).join('')||'<div style="color:var(--sub);font-size:13px">없음</div>'}`,null,true);
}

/* ---------- utils ---------- */
function openModal(title,html,onOk,infoOnly){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><h3>${title}</h3><div class="mbody">${html}</div>
    <div class="modal-actions">${infoOnly?'<button class="btn" data-x>닫기</button>':'<button class="btn gray" data-x>취소</button><button class="btn" data-ok>확인</button>'}</div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click',e=>{if(e.target===bg)bg.remove();});
  bg.querySelector('[data-x]').addEventListener('click',()=>bg.remove());
  const ok=bg.querySelector('[data-ok]');if(ok)ok.addEventListener('click',()=>{if(onOk&&onOk()===false)return;bg.remove();});
  window._modal=bg;
}
function closeModal(){if(window._modal)window._modal.remove();}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove('show'),2000);}
function esc(s){return (s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function val(id){return document.getElementById(id).value.trim();}
function today(){const d=new Date();return (d.getMonth()+1)+'/'+d.getDate();}

/* ---------- boot ---------- */
buildLogin();
if(S.session && S.remember && acctBySid(S.session)){enterApp();}
/* PWA: 서비스워커 등록 (설치·오프라인 지원) */
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
/* 전역 오류 자동 기록 → Firestore errorLogs */
window.addEventListener('error',function(e){try{logError('js',e.message,(e.filename||'')+':'+(e.lineno||'')+':'+(e.colno||'')+'\n'+((e.error&&e.error.stack)||''));}catch(_){}});
window.addEventListener('unhandledrejection',function(e){try{var r=e.reason;logError('promise',(r&&r.message)||(''+r),(r&&r.stack)||'');}catch(_){}});
</script>

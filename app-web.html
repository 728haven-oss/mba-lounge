<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MBA Lounge — 웹앱</title>
<meta name="theme-color" content="#6C5CE7" />
<style>
  :root{
    --pri:#6C5CE7; --pri2:#8B7CF7; --soft:#EFEBFF;
    --bg:#F5F6FB; --card:#fff; --ink:#1F2430; --sub:#8A90A0; --line:#ECEEF4;
    --shadow:0 2px 16px rgba(31,36,48,.07); --r:16px;
    --green:#22C55E; --green-s:#E9F9EF; --amber:#F59E0B;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif}
  body{background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}
  .hidden{display:none !important}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#d7dae6;border-radius:8px}
  .mark{display:inline-block;line-height:0}
  .mark svg{display:block}

  /* ---------- Login ---------- */
  #login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1000px 600px at 50% -10%,var(--soft),var(--bg));padding:24px;overflow:auto}
  .login-card{background:var(--card);border-radius:26px;box-shadow:0 30px 80px rgba(31,36,48,.16);width:100%;max-width:760px;padding:44px;margin:auto}
  .login-brand{display:flex;align-items:center;gap:12px;font-size:26px;font-weight:800;justify-content:center}
  .login-brand b{color:var(--pri)}
  .login-sub{text-align:center;color:var(--sub);margin-top:8px;font-size:14.5px}
  .login-step{font-weight:800;margin:28px 0 14px;font-size:15px;display:flex;align-items:center;gap:8px}
  .login-step .st-n{width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:800}
  .school-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  @media(max-width:640px){.school-grid{grid-template-columns:repeat(3,1fr)}}
  .school-btn{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.15s;text-align:center}
  .school-btn:hover{border-color:var(--pri);transform:translateY(-2px);box-shadow:var(--shadow)}
  .school-btn.sel{border-color:var(--pri);background:var(--soft)}
  .school-btn .snm{font-size:12px;font-weight:700;color:var(--ink)}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.fields{grid-template-columns:1fr}}
  .fld label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:6px}
  .fld .req{color:var(--pri)}
  .fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 13px;font-size:14px;background:#fff;outline:none;font-family:inherit}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pri)}
  .fld.full{grid-column:1 / -1}
  .login-go{margin-top:26px;width:100%;border:none;border-radius:13px;padding:15px;font-size:16px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,var(--pri),var(--pri2));box-shadow:0 12px 26px rgba(108,92,231,.35);transition:.15s}
  .login-go:hover{transform:translateY(-1px)}
  .login-go:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .login-note{text-align:center;color:var(--sub);font-size:12px;margin-top:14px}

  /* ---------- App shell ---------- */
  .topbar{position:sticky;top:0;z-index:40;height:64px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:16px;padding:0 22px}
  .topbar .brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800}
  .topbar .brand b{color:var(--pri)}
  .school-chip{display:flex;align-items:center;gap:9px;background:var(--soft);color:var(--pri);border:1px solid transparent;
    border-radius:22px;padding:6px 14px 6px 8px;font-weight:800;font-size:13.5px;cursor:pointer}
  .school-chip:hover{border-color:var(--pri)}
  .topbar .spacer{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 14px;width:280px;color:var(--sub)}
  .search input{border:none;background:none;outline:none;width:100%;font-size:14px;color:var(--ink)}
  @media(max-width:900px){.search{display:none}}
  .me-btn{display:flex;align-items:center;gap:10px;background:none;border:none;padding:4px}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--pri);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}

  .shell{display:grid;grid-template-columns:248px 1fr;align-items:start;max-width:1280px;margin:0 auto}
  @media(max-width:860px){.shell{grid-template-columns:1fr}}
  .sidebar{position:sticky;top:64px;padding:22px 16px;height:calc(100vh - 64px);overflow:auto}
  @media(max-width:860px){.sidebar{position:static;height:auto;display:flex;gap:8px;overflow-x:auto;padding:12px}}
  .side-h{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.6px;padding:10px 14px 6px;text-transform:uppercase}
  @media(max-width:860px){.side-h{display:none}}
  .nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:#565b6b;font-weight:700;font-size:14.5px;white-space:nowrap;border:none;background:none;width:100%;text-align:left;transition:.12s}
  .nav-item .ni{font-size:18px;width:22px;text-align:center}
  .nav-item:hover{background:var(--card);color:var(--ink)}
  .nav-item.active{background:var(--pri);color:#fff;box-shadow:0 8px 20px rgba(108,92,231,.3)}

  .main{padding:28px 34px 70px;min-height:calc(100vh - 64px)}
  @media(max-width:640px){.main{padding:20px 16px 60px}}
  .page-head{margin-bottom:22px}
  .page-head h1{font-size:26px;font-weight:800;letter-spacing:-.4px}
  .page-head p{color:var(--sub);margin-top:6px;font-size:14.5px}
  .eyebrow{color:var(--pri);font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .btn{border:none;border-radius:11px;padding:11px 18px;font-weight:800;font-size:14px;background:var(--pri);color:#fff;transition:.12s}
  .btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .btn.ghost{background:#fff;color:var(--pri);border:1.5px solid var(--soft)}
  .btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
  .btn.gray{background:#EEF0F5;color:#6b7180}
  .chip-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
  .chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 15px;font-size:13px;font-weight:700;color:var(--sub)}
  .chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
  .empty{color:var(--sub);text-align:center;padding:40px;font-size:14px}

  /* dashboard */
  .hero-band{border-radius:22px;padding:34px 36px;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));position:relative;overflow:hidden}
  .hero-band::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;background:rgba(255,255,255,.1);border-radius:50%}
  .hero-band h2{font-size:24px;font-weight:800;position:relative}
  .hero-band p{color:rgba(255,255,255,.9);margin-top:8px;position:relative;font-size:14.5px}
  .hero-band .slogan{margin-top:16px;display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:7px 15px;border-radius:20px;font-weight:700;font-size:13.5px;position:relative}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
  @media(max-width:640px){.kpis{grid-template-columns:1fr}}
  .kpi{padding:22px;text-align:left}
  .kpi .k-ic{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}
  .kpi .k-n{font-size:26px;font-weight:800}
  .kpi .k-l{color:var(--sub);font-size:13.5px;margin-top:2px}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  @media(max-width:860px){.dash-grid{grid-template-columns:1fr}}
  .panel{padding:22px}
  .panel h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .panel h3 .more{margin-left:auto;font-size:12.5px;color:var(--pri);font-weight:700;cursor:pointer}
  .mini-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .mini-row:first-of-type{border-top:none}
  .mini-row .mt{font-weight:700;font-size:14px}
  .mini-row .ms{color:var(--sub);font-size:12.5px;margin-top:2px}
  .date-chip{background:var(--soft);color:var(--pri);border-radius:11px;font-size:12px;font-weight:800;padding:8px 10px;text-align:center;min-width:52px;flex-shrink:0}

  /* posts */
  .post-card{padding:22px;margin-bottom:14px}
  .post-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .post-top .who{font-weight:800;font-size:14px}
  .post-top .meta{color:var(--sub);font-size:12.5px}
  .cat-tag{font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:20px;background:var(--soft);color:var(--pri)}
  .cat-tag.deal{background:#FFF3E0;color:#C77700}
  .cat-tag.invest{background:#E7F6EE;color:#1E9E54}
  .cat-tag.hire{background:#E8EEFF;color:#3B5BDB}
  .cat-tag.info{background:#F0EEFB;color:#6C5CE7}
  .post-card h3{font-size:17px;font-weight:800}
  .post-card .body{color:#464c59;margin-top:8px;font-size:14.5px;white-space:pre-wrap}
  .post-actions{display:flex;gap:18px;margin-top:14px;color:var(--sub);font-size:13px;font-weight:700}
  .post-actions button{background:none;border:none;color:var(--sub);font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px}
  .post-actions button.on{color:var(--pri)}
  .comments{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .cmt{display:flex;gap:9px;font-size:13.5px;padding:5px 0}
  .cmt b{font-weight:800}
  .cmt-form{display:flex;gap:8px;margin-top:10px}
  .cmt-form input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;outline:none}
  .cmt-form input:focus{border-color:var(--pri)}

  /* meetups */
  .meet-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  @media(max-width:860px){.meet-grid{grid-template-columns:1fr}}
  .meet-card{padding:22px;display:flex;flex-direction:column}
  .meet-card .m-date{display:inline-flex;align-items:center;gap:8px;color:var(--pri);font-weight:800;font-size:13px}
  .meet-card h3{font-size:17px;font-weight:800;margin-top:10px}
  .meet-card .m-info{color:var(--sub);font-size:13px;margin-top:8px;display:flex;flex-direction:column;gap:4px}
  .meet-foot{display:flex;align-items:center;gap:12px;margin-top:16px}
  .attend{border:1.5px solid var(--green);color:var(--green);background:#fff;border-radius:11px;padding:9px 16px;font-weight:800;font-size:13.5px}
  .attend.going{background:var(--green);color:#fff}
  .cap-bar{flex:1;height:8px;background:#EEF0F5;border-radius:6px;overflow:hidden}
  .cap-bar i{display:block;height:100%;background:var(--pri)}
  .cap-txt{font-size:12.5px;color:var(--sub);font-weight:700}

  /* directory / 원우수첩 */
  .dir-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media(max-width:1000px){.dir-grid{grid-template-columns:1fr 1fr}}
  @media(max-width:640px){.dir-grid{grid-template-columns:1fr}}
  .mem-card{padding:22px}
  .mem-top{display:flex;align-items:center;gap:14px}
  .mem-av{width:56px;height:56px;border-radius:50%;background:var(--soft);color:var(--pri);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .mem-nm{font-weight:800;font-size:16px}
  .mem-sub{color:var(--sub);font-size:12.5px;margin-top:2px}
  .mem-head{font-size:13px;color:#464c59;margin-top:3px;font-weight:600}
  .mem-sec{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .kv{display:flex;gap:8px;font-size:13px;padding:3px 0;align-items:flex-start}
  .kv .k{color:var(--sub);width:58px;flex-shrink:0;font-weight:600}
  .kv .v{color:#333a48;flex:1}
  .lock{color:var(--sub);font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
  .career-item{font-size:12.5px;color:#4a5160;padding:3px 0;display:flex;gap:8px}
  .career-item .cc{font-weight:700;color:#333a48}
  .career-item .cp{color:var(--sub);margin-left:auto;white-space:nowrap}
  .exch-line{margin-top:12px;display:flex;align-items:center;gap:10px}
  .badge-exp{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--soft);color:var(--pri)}
  .badge-exp.full{background:var(--green-s);color:#1E9E54}
  .badge-exp.minimal{background:#FBEAEA;color:#C0392B}
  .exchanged{color:var(--green);font-weight:800;font-size:12.5px}

  /* clubs */
  .club-card{padding:22px;text-align:center}
  .club-emoji{font-size:34px}
  .club-nm{font-weight:800;font-size:16px;margin-top:8px}
  .club-cat{color:var(--sub);font-size:12.5px;margin-top:3px}
  .club-desc{color:#4a5160;font-size:13px;margin-top:10px;min-height:38px}
  .club-tags{display:flex;flex-wrap:wrap;gap:6px}
  .club-chip{background:var(--soft);color:var(--pri);font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px}
  /* profile exposure */
  .exp-seg{display:flex;flex-direction:column;gap:10px}
  .exp-opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
  .exp-opt b{font-size:14.5px;font-weight:800}
  .exp-opt span{font-size:12.5px;color:var(--sub)}
  .exp-opt:hover{border-color:var(--pri)}
  .exp-opt.on{border-color:var(--pri);background:var(--soft)}
  .exp-opt.on b{color:var(--pri)}
  .career-row{display:grid;grid-template-columns:1fr 1fr 120px 34px;gap:8px;margin-bottom:8px;align-items:center}
  .career-row input{border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;font-size:13px;outline:none}
  .career-row input:focus{border-color:var(--pri)}
  .career-row .del{border:none;background:#F3EEF0;color:#C0392B;border-radius:8px;font-weight:800;font-size:16px;height:34px}
  @media(max-width:600px){.career-row{grid-template-columns:1fr 1fr;}.career-row .cp-in{grid-column:1/2}.career-row .del{grid-column:2/3;width:44px;justify-self:end}}

  /* notices */
  .notice-row{padding:18px 22px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);cursor:pointer}
  .notice-row:last-child{border-bottom:none}
  .notice-row:hover{background:var(--bg)}
  .notice-row .src{font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px;background:var(--soft);color:var(--pri);flex-shrink:0}
  .notice-row .nt{font-weight:700;font-size:14.5px}
  .notice-row .nd{color:var(--sub);font-size:12px;margin-top:2px}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(20,18,31,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:28px}
  .modal h3{font-size:19px;font-weight:800;margin-bottom:16px}
  .modal .fld{margin-bottom:14px}
  .modal textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px;font-size:14px;outline:none;resize:vertical;min-height:110px;font-family:inherit}
  .modal textarea:focus{border-color:var(--pri)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}

  #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:12px;font-size:14px;font-weight:600;z-index:120;opacity:0;transition:.25s;pointer-events:none}
  #toast.show{opacity:1}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="login-card">
    <div class="login-brand"><span id="login-mark"></span>MBA <b>Lounge</b></div>
    <div class="login-sub">라운지, 만남이 쉬워지는 공간 · 데스크톱 웹앱</div>

    <div class="login-step"><span class="st-n">1</span>학교를 선택하세요</div>
    <div class="school-grid" id="schoolGrid"></div>

    <div class="login-step"><span class="st-n">2</span>프로필 정보를 입력하세요</div>
    <div class="fields">
      <div class="fld"><label>학번 <span class="req">*</span></label><input id="in-sid" placeholder="예: 2024-12345" /></div>
      <div class="fld"><label>이름 <span class="req">*</span></label><input id="in-name" placeholder="예: 김재성" /></div>
      <div class="fld"><label>기수 <span class="req">*</span></label><input id="in-gisu" placeholder="예: 12" /></div>
      <div class="fld"><label>생년월일</label><input id="in-birth" type="text" placeholder="예: 1985-03-12" /></div>
      <div class="fld"><label>현재 회사 <span class="req">*</span></label><input id="in-company" placeholder="예: OO기업" /></div>
      <div class="fld"><label>직책 <span class="req">*</span></label><input id="in-title" placeholder="예: 전략기획 부장" /></div>
      <div class="fld"><label>이메일 <span class="req">*</span></label><input id="in-email" placeholder="예: me@company.com" /></div>
      <div class="fld"><label>연락처</label><input id="in-phone" placeholder="예: 010-0000-0000" /></div>
      <div class="fld full"><label>한 줄 소개 (헤드라인)</label><input id="in-head" placeholder="예: 제조업 전략기획 · 신사업 개발 관심" /></div>
    </div>
    <button class="login-go" id="loginGo" disabled>선택한 학교로 시작하기</button>
    <div class="login-note">학번·이름·회사·직책·이메일은 항상 공개됩니다. 연락처·생년월일·이력은 프로필에서 공개 범위를 조절할 수 있어요.</div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="brand"><span id="top-mark"></span>MBA <b>Lounge</b></div>
    <button class="school-chip" id="schoolChip" title="학교 변경"></button>
    <div class="spacer"></div>
    <div class="search">🔎<input id="globalSearch" placeholder="원우·모임·게시글 검색" /></div>
    <button class="me-btn" id="meBtn"><span class="avatar" id="meAv"></span></button>
  </div>

  <div class="shell">
    <aside class="sidebar">
      <div class="side-h">메뉴</div>
      <button class="nav-item" data-view="home"><span class="ni">🏠</span>홈</button>
      <button class="nav-item" data-view="board"><span class="ni">💼</span>비즈니스 게시판</button>
      <button class="nav-item" data-view="meet"><span class="ni">🤝</span>만남 · 미팅</button>
      <button class="nav-item" data-view="dir"><span class="ni">📇</span>원우수첩</button>
      <button class="nav-item" data-view="club"><span class="ni">🎫</span>동아리</button>
      <button class="nav-item" data-view="notice"><span class="ni">🔔</span>공지</button>
      <div class="side-h" style="margin-top:12px">내 활동</div>
      <button class="nav-item" data-view="me"><span class="ni">👤</span>내 프로필</button>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>

<div id="toast"></div>

<script>

function schoolMark(s,size){
  const sz=size||34; const fs=s.short.length>=4?8:(s.short.length>2?9.5:11);
  return `<span class="mark"><svg viewBox="0 0 40 48" width="${sz}" height="${Math.round(sz*1.18)}">
    <defs><linearGradient id="g-${s.id}-${sz}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${s.color}"/><stop offset="1" stop-color="${s.c2}"/></linearGradient></defs>
    <path d="M20 2 L37 8 V24 C37 36 29 43 20 46 C11 43 3 36 3 24 V8 Z" fill="url(#g-${s.id}-${sz})" stroke="rgba(255,255,255,.55)" stroke-width="1.6"/>
    <text x="20" y="${s.short.length>2?27:28}" text-anchor="middle" fill="#fff" font-size="${fs}" font-weight="800" font-family="sans-serif">${s.short}</text>
  </svg></span>`;
}

/* ===================== STATE ===================== */
const LS='mbaweb_v4';
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(LS));if(r&&r.user)return r;}catch(e){}
  return {user:null,posts:seedPosts,meets:seedMeets,notices:seedNotices,members:seedMembers,exchanged:[]};}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function schoolByName(n){return schools.find(s=>s.name===n);}

/* ===================== THEME ===================== */
function applyTheme(s){const r=document.documentElement.style;
  r.setProperty('--pri',s.color);r.setProperty('--pri2',s.c2);r.setProperty('--soft',s.soft);}

/* ===================== LOGIN ===================== */
const LOGIN_IDS=['in-sid','in-name','in-gisu','in-birth','in-company','in-title','in-email','in-phone','in-head'];
let pickedSchool=null;
function buildLogin(){
  document.getElementById('login-mark').innerHTML=schoolMark(schools[0],34);
  const grid=document.getElementById('schoolGrid');
  grid.innerHTML=schools.map(s=>`<button class="school-btn" data-id="${s.id}">${schoolMark(s,34)}<span class="snm">${s.short}</span></button>`).join('');
  grid.querySelectorAll('.school-btn').forEach(b=>b.addEventListener('click',()=>{
    pickedSchool=schools.find(s=>s.id===b.dataset.id);
    grid.querySelectorAll('.school-btn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    applyTheme(pickedSchool);
    document.getElementById('login-mark').innerHTML=schoolMark(pickedSchool,34);
    validateLogin();
  }));
  LOGIN_IDS.forEach(id=>document.getElementById(id).addEventListener('input',validateLogin));
  document.getElementById('loginGo').addEventListener('click',doLogin);
}
function validateLogin(){
  const need=['in-sid','in-name','in-gisu','in-company','in-title','in-email'];
  const ok=pickedSchool && need.every(id=>document.getElementById(id).value.trim());
  document.getElementById('loginGo').disabled=!ok;
  if(pickedSchool)document.getElementById('loginGo').textContent=pickedSchool.name+'(으)로 시작하기';
}
function gv(id){return document.getElementById(id).value.trim();}
function doLogin(){
  S.user={sid:gv('in-sid'),name:gv('in-name'),school:pickedSchool.name,gisu:gv('in-gisu')||'12',course:'MBA',
    birth:gv('in-birth'),company:gv('in-company'),title:gv('in-title'),head:gv('in-head'),
    email:gv('in-email'),phone:gv('in-phone'),career:[],clubs:[],exposure:'basic'};
  save();enterApp();
}

/* ===================== APP ===================== */
function enterApp(){
  if(!S.user.exposure)S.user.exposure='basic';
  if(!S.user.career)S.user.career=[];
  if(!S.user.clubs)S.user.clubs=[];
  const s=schoolByName(S.user.school)||schools[0];
  applyTheme(s);
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('top-mark').innerHTML=schoolMark(s,30);
  document.getElementById('schoolChip').innerHTML=schoolMark(s,22)+'<span>'+s.short+'</span>';
  document.getElementById('meAv').textContent=S.user.name.slice(0,1);
  document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));
  document.getElementById('schoolChip').addEventListener('click',switchSchool);
  document.getElementById('meBtn').addEventListener('click',()=>go('me'));
  document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch(e.target.value);});
  go('home');
}
function switchSchool(){
  const opts=schools.map(s=>`<button class="school-btn" data-id="${s.id}">${schoolMark(s,34)}<span class="snm">${s.short}</span></button>`).join('');
  openModal('학교 변경',`<p style="color:var(--sub);font-size:13.5px;margin-bottom:14px">학교를 바꾸면 화면 테마와 소식이 해당 학교로 전환됩니다.</p><div class="school-grid">${opts}</div>`,null,true);
  document.querySelectorAll('.modal .school-btn').forEach(b=>b.addEventListener('click',()=>{
    const s=schools.find(x=>x.id===b.dataset.id);S.user.school=s.name;save();closeModal();enterApp();toast(s.name+' 테마로 전환되었습니다');
  }));
}
let currentView='home';
function go(v){currentView=v;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  const m=document.getElementById('main');window.scrollTo(0,0);
  ({home:viewHome,board:viewBoard,meet:viewMeet,dir:viewDir,club:viewClub,notice:viewNotice,me:viewMe}[v]||viewHome)(m);
}

function postHTML(p){

      <div style="flex:1"><div class="who">${esc(p.who)}</div><div class="meta">${esc(p.co)} · ${p.date}</div></div>

function bindPost(m){
  m.querySelectorAll('.like').forEach(b=>b.addEventListener('click',()=>{const p=S.posts.find(x=>x.id===b.dataset.id);p.liked=!p.liked;p.likes+=p.liked?1:-1;save();b.classList.toggle('on',p.liked);b.querySelector('span').textContent=p.likes;}));

let dirScope='all';
const EXP={full:{t:'전체 공개',protect:[]},basic:{t:'기본',protect:['phone','birth']},minimal:{t:'최소 공개',protect:['phone','birth','career']}};
function isProtected(exp,field){return (EXP[exp]||EXP.basic).protect.includes(field);}
function memKey(x){return x.name+'|'+x.school+'|'+x.gisu;}

function viewDir(m){
  const mine=S.user.school;

    if(!S.exchanged.includes(key)){S.exchanged.push(key);save();}viewDir(m);toast('연락처를 교환했습니다');}));

function memHTML(x){
  const key=memKey(x), done=S.exchanged.includes(key), ss=schoolByName(x.school), exp=x.exposure||'basic';
  const canSee=f=>!isProtected(exp,f)||done;
  const expBadge=exp==='full'?'<span class="badge-exp full">전체 공개</span>':(exp==='minimal'?'<span class="badge-exp minimal">최소 공개</span>':'<span class="badge-exp">기본</span>');
  // core (always public)
  let rows=`
    <div class="kv"><span class="k">학번</span><span class="v">${esc(x.sid)}</span></div>
    <div class="kv"><span class="k">이메일</span><span class="v">${esc(x.email)}</span></div>`;
  // birth (adjustable)
  rows+=`<div class="kv"><span class="k">생년월일</span><span class="v">${canSee('birth')?(esc(x.birth)||'—'):'<span class="lock">🔒 교환 후 공개</span>'}</span></div>`;

  rows+=`<div class="kv"><span class="k">연락처</span><span class="v">${canSee('phone')?(esc(x.phone)||'—'):'<span class="lock">🔒 교환 후 공개</span>'}</span></div>`;
  // career (adjustable)
  let careerHTML;
  if(canSee('career')){
    careerHTML=(x.career&&x.career.length)?x.career.map(c=>`<div class="career-item"><span class="cc">${esc(c.c)}</span> ${esc(c.r)}<span class="cp">${esc(c.p)}</span></div>`).join(''):'<div class="lock">이력 없음</div>';
  }else{careerHTML='<div class="lock">🔒 교환 후 공개</div>';}
  const needExch=(!done)&&(EXP[exp].protect.length>0);
  return `<div class="mem-card card">
    <div class="mem-top">
      <div class="mem-av">${x.name.slice(0,1)}</div>
      <div style="flex:1"><div class="mem-nm">${esc(x.name)} ${expBadge}</div>

      </div>
    </div>
    <div class="mem-sec">${rows}</div>
    <div class="mem-sec"><div style="font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px">소속 동아리</div>${(x.clubs&&x.clubs.length)?`<div class="club-tags">${x.clubs.map(c=>`<span class="club-chip">${esc(c)}</span>`).join('')}</div>`:'<div class="lock">없음</div>'}</div>
    <div class="mem-sec"><div style="font-size:12px;font-weight:800;color:var(--sub);margin-bottom:6px">이력</div>${careerHTML}</div>
    ${needExch?`<div class="exch-line"><button class="btn sm exch" data-k="${key}">연락처 교환</button><span class="lock">교환하면 잠긴 정보가 공개됩니다</span></div>`:(done?'<div class="exch-line"><span class="exchanged">✓ 연락처 교환 완료</span></div>':'')}
  </div>`;
}

      <div style="font-weight:800;font-size:16px">개인정보 공개 범위</div>
      <p style="color:var(--sub);font-size:13.5px;margin-top:4px;margin-bottom:16px">학번·이름·회사·직책·이메일은 항상 공개됩니다. 아래에서 <b>연락처·생년월일·이력</b>의 공개 정도를 선택하세요.</p>
      <div class="exp-seg">
        ${['full','basic','minimal'].map(e=>`<button class="exp-opt ${(u.exposure||'basic')===e?'on':''}" data-e="${e}"><b>${expTitle(e)}</b><span>${expDesc(e)}</span></button>`).join('')}
      </div>
      <div style="margin-top:20px">
        <div style="font-weight:700;font-size:13px;color:var(--sub);margin-bottom:10px">👀 다른 원우에게 보이는 내 카드 미리보기</div>
        <div id="prevBox">${myPreviewCard()}</div>
      </div>
    </div>`;
  renderCareerEditor(m);
  m.querySelector('#addCareer').addEventListener('click',()=>{editCareer.push({c:'',r:'',p:''});renderCareerEditor(m);});
  m.querySelector('#saveCareer').addEventListener('click',()=>{u.career=editCareer.filter(c=>c.c.trim()||c.r.trim());save();m.querySelector('#prevBox').innerHTML=myPreviewCard();toast('이력이 저장되었습니다');});
  m.querySelector('#me-save').addEventListener('click',()=>{u.company=val('me-co');u.title=val('me-ti');u.head=val('me-head');u.email=val('me-em');u.phone=val('me-ph');u.birth=val('me-bd');save();document.getElementById('meAv').textContent=(u.name||'나').slice(0,1);m.querySelector('#prevBox').innerHTML=myPreviewCard();toast('저장되었습니다');});
  m.querySelector('#me-out').addEventListener('click',()=>{if(confirm('로그아웃하시겠어요? (데모 데이터는 유지됩니다)')){S.user=null;save();location.reload();}});
  m.querySelectorAll('.exp-opt').forEach(b=>b.addEventListener('click',()=>{u.exposure=b.dataset.e;save();
    m.querySelectorAll('.exp-opt').forEach(o=>o.classList.toggle('on',o.dataset.e===u.exposure));
    m.querySelector('#prevBox').innerHTML=myPreviewCard();toast('공개 범위: '+expTitle(u.exposure));}));
}
function renderCareerEditor(m){
  const box=m.querySelector('#careerList');
  box.innerHTML=editCareer.map((c,i)=>`<div class="career-row">
    <input data-i="${i}" data-f="c" value="${esc(c.c)}" placeholder="회사명">
    <input data-i="${i}" data-f="r" value="${esc(c.r)}" placeholder="역할/직책">
    <input class="cp-in" data-i="${i}" data-f="p" value="${esc(c.p)}" placeholder="기간 예:2015–2020">
    <button class="del" data-i="${i}">×</button></div>`).join('')||'<p style="color:var(--sub);font-size:13px;margin-bottom:10px">등록된 경력이 없습니다.</p>';
  box.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',()=>{editCareer[inp.dataset.i][inp.dataset.f]=inp.value;}));
  box.querySelectorAll('.del').forEach(b=>b.addEventListener('click',()=>{editCareer.splice(b.dataset.i,1);renderCareerEditor(m);}));
}

/* ---------- search ---------- */
function doSearch(q){q=q.trim();if(!q)return;
  const posts=S.posts.filter(p=>(p.title+p.body+p.who).includes(q));
  const mem=S.members.filter(x=>(x.name+x.company+x.title+x.sid).includes(q));
  const meets=S.meets.filter(x=>(x.title+x.place+x.org).includes(q));
  openModal('“'+esc(q)+'” 검색 결과',`
    <p style="font-weight:800;margin:6px 0 6px">💼 게시글 ${posts.length}</p>${posts.map(p=>`<div class="cmt"><b>${esc(p.who)}</b><span>${esc(p.title)}</span></div>`).join('')||'<div style="color:var(--sub);font-size:13px">없음</div>'}
    <p style="font-weight:800;margin:14px 0 6px">📇 원우 ${mem.length}</p>${mem.map(x=>`<div class="cmt"><b>${esc(x.name)}</b><span>${esc(x.company)} ${esc(x.title)}</span></div>`).join('')||'<div style="color:var(--sub);font-size:13px">없음</div>'}
    <p style="font-weight:800;margin:14px 0 6px">🤝 모임 ${meets.length}</p>${meets.map(x=>`<div class="cmt"><b>${esc(x.date)}</b><span>${esc(x.title)}</span></div>`).join('')||'<div style="color:var(--sub);font-size:13px">없음</div>'}`,null,true);
}

/* ---------- modal / toast / utils ---------- */
function openModal(title,html,onOk,infoOnly){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><h3>${title}</h3><div class="mbody">${html}</div>
    <div class="modal-actions">${infoOnly?'<button class="btn" data-x>닫기</button>':'<button class="btn gray" data-x>취소</button><button class="btn" data-ok>확인</button>'}</div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click',e=>{if(e.target===bg)bg.remove();});
  bg.querySelector('[data-x]').addEventListener('click',()=>bg.remove());
  const ok=bg.querySelector('[data-ok]');if(ok)ok.addEventListener('click',()=>{if(onOk&&onOk()===false)return;bg.remove();});
  window._modal=bg;
}
function closeModal(){if(window._modal)window._modal.remove();}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove('show'),2000);}
function esc(s){return (s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function val(id){return document.getElementById(id).value.trim();}
function today(){const d=new Date();return (d.getMonth()+1)+'/'+d.getDate();}

/* ---------- boot ---------- */
buildLogin();
if(S.user){enterApp();}

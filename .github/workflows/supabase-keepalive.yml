# Supabase 무료 플랜은 7일간 활동이 '충분하지' 않으면 프로젝트가 자동 중지되고,
# 그 순간 출시된 앱의 로그인·게시글이 전부 멈춘다.
# 공식 FAQ 기준 "하루 몇 건" 수준의 DB 요청이 필요하다.
# 2026-10-29: 하루 1회 핑으로도 '활동 부족' 경고 메일이 와서
#   6시간마다 × (RPC 2회 + 테이블 읽기 1회) = 하루 12건으로 올림.
#
# 사용하는 키는 publishable(anon) 키로, 이미 앱에 공개된 값이라 노출돼도 안전하다.
# ping() 함수는 heartbeat 테이블 1행만 갱신하고, site_posts 읽기는 공개 게시판(누구나 읽기)이다.

name: Supabase keep-alive

on:
  schedule:
    # 6시간마다 (UTC 00:17 / 06:17 / 12:17 / 18:17). 정각을 피해 실행 지연을 줄인다.
    - cron: '17 */6 * * *'
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase DB 깨우기
        env:
          SB_URL: https://jvzkruingckrsdnvvekz.supabase.co
          SB_ANON: sb_publishable_M2KZd5PeoHEwwpTFxVwsCg_8tjYRkfB
        run: |
          set -euo pipefail
          ok=0

          # 1) RPC ping 2회 (중지 상태에서 깨어나는 데 시간이 걸릴 수 있어 재시도 포함)
          for i in 1 2; do
            for try in 1 2 3; do
              code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' \
                -X POST "$SB_URL/rest/v1/rpc/ping" \
                -H "apikey: $SB_ANON" \
                -H "Content-Type: application/json" \
                --max-time 60 \
                -d '{}' || echo 000)
              echo "ping $i/시도 $try → HTTP $code / $(cat /tmp/out.txt)"
              if [ "$code" = "200" ]; then ok=$((ok+1)); break; fi
              sleep 20
            done
            sleep 5
          done

          # 2) 공개 게시판 테이블 읽기 1회 (일반 SELECT 트래픽)
          code=$(curl -sS -o /tmp/out2.txt -w '%{http_code}' \
            "$SB_URL/rest/v1/site_posts?select=id&limit=1" \
            -H "apikey: $SB_ANON" \
            --max-time 60 || echo 000)
          echo "site_posts 읽기 → HTTP $code / $(head -c 200 /tmp/out2.txt)"
          if [ "$code" = "200" ]; then ok=$((ok+1)); fi

          echo "성공 요청 수: $ok / 3"
          if [ "$ok" -ge 1 ]; then
            echo "OK - Supabase 정상."
            exit 0
          fi

          echo "FAIL - Supabase 핑 실패. 프로젝트가 중지되었거나 키가 바뀌었을 수 있음."
          echo "  https://supabase.com/dashboard/project/jvzkruingckrsdnvvekz 확인 필요"
          exit 1

# Supabase 무료 플랜은 7일간 활동이 없으면 프로젝트가 자동 중지되고,
# 그 순간 출시된 앱의 로그인·게시글이 전부 멈춘다.
# 매일 DB에 실제 쿼리를 한 번 보내 '활동'을 만들어 중지를 막는다.
#
# 사용하는 키는 publishable(anon) 키로, 이미 앱에 공개된 값이라 노출돼도 안전하다.
# ping() 함수는 heartbeat 테이블 1행만 갱신하며 다른 데이터에 접근하지 않는다.

name: Supabase keep-alive

on:
  schedule:
    # 매일 00:17 UTC (한국시간 09:17). 정각을 피해 실행 지연을 줄인다.
    - cron: '17 0 * * *'
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase DB 깨우기
        env:
          SB_URL: https://jvzkruingckrsdnvvekz.supabase.co
          SB_ANON: sb_publishable_M2KZd5PeoHEwwpTFxVwsCg_8tjYRkfB
        run: |
          set -euo pipefail

          # 중지 상태에서 깨어나는 데 시간이 걸릴 수 있어 3회까지 재시도
          for i in 1 2 3; do
            echo "시도 $i ..."
            code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' \
              -X POST "$SB_URL/rest/v1/rpc/ping" \
              -H "apikey: $SB_ANON" \
              -H "Content-Type: application/json" \
              --max-time 60 \
              -d '{}' || echo 000)

            echo "HTTP $code / 응답: $(cat /tmp/out.txt)"

            if [ "$code" = "200" ]; then
              echo "OK - Supabase 정상. 마지막 핑 $(cat /tmp/out.txt)"
              exit 0
            fi
            sleep 20
          done

          echo "FAIL - Supabase 핑 실패. 프로젝트가 중지되었거나 키가 바뀌었을 수 있음."
          echo "       https://supabase.com/dashboard/project/jvzkruingckrsdnvvekz 확인 필요"
          exit 1

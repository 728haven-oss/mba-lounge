# 학교 공식 RSS 소식을 매일 모아 assets/data/feed.json 을 갱신합니다.
name: News Sync

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 06:17 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/news-sync.mjs
      - name: 바뀐 내용이 있으면 커밋
        run: |
          if [ -n "$(git status --porcelain assets/data/feed.json)" ]; then
            git config user.name "mba-lounge-bot"
            git config user.email "mba-lounge-bot@users.noreply.github.com"
            git add assets/data/feed.json
            git commit -m "news: 학교 소식 자동 갱신"
            git push
          fi

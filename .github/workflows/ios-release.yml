# MBA Lounge — iOS 빌드 & App Store 업로드 (맥북 불필요)
# 이 파일 하나를 리포지토리의 .github/workflows/ios-release.yml 로 올리면 됩니다.
# 실행: GitHub → Actions → "iOS Release" → Run workflow
#
# 필요한 Secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID       : App Store Connect API 키 ID (예: ABC123DEFG)
#   ASC_ISSUER_ID    : Issuer ID (UUID 형태)
#   ASC_PRIVATE_KEY  : AuthKey_XXXX.p8 파일 "내용 전체" (-----BEGIN PRIVATE KEY----- 포함)
#   APPLE_TEAM_ID    : 팀 ID (예: A1B2C3D4E5)

name: iOS Release

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "앱 버전 (예: 1.0.1)"
        required: true
        default: "1.0.1"
      build_number:
        description: "빌드 번호 (비우면 실행 번호 사용)"
        required: false
        default: ""

jobs:
  build-upload:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      APP_NAME: "MBA Lounge"
      BUNDLE_ID: "com.mba.lounge"
      LIVE_URL: "https://728haven-oss.github.io/mba-lounge/app-web.html"
      MARKETING_VERSION: ${{ github.event.inputs.marketing_version }}

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 빌드 번호 결정
        run: |
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            echo "BUILD_NUMBER=${{ github.event.inputs.build_number }}" >> $GITHUB_ENV
          else
            echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Xcode 최신 버전 선택
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          echo "--- 사용 가능한 SDK ---"
          xcodebuild -showsdks | grep -i ios || true

      # ------------------------------------------------------------------
      # 1) 프로젝트 소스 생성 (별도 파일 없이 여기서 전부 만듭니다)
      # ------------------------------------------------------------------
      - name: 프로젝트 파일 생성
        run: |
          set -e
          mkdir -p build-ios/Sources build-ios/Resources
          cd build-ios

          # ---------- App 진입점 ----------
          cat > Sources/MBALoungeApp.swift <<'SWIFT'
          import SwiftUI

          @main
          struct MBALoungeApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          SWIFT

          # ---------- WebView 화면 ----------
          cat > Sources/ContentView.swift <<SWIFT
          import SwiftUI
          import WebKit

          struct WebView: UIViewRepresentable {
              let url: URL

              func makeCoordinator() -> Coordinator { Coordinator() }

              func makeUIView(context: Context) -> WKWebView {
                  let config = WKWebViewConfiguration()
                  config.defaultWebpagePreferences.allowsContentJavaScript = true
                  config.websiteDataStore = .default()          // localStorage 유지 (자동로그인)
                  config.allowsInlineMediaPlayback = true

                  let webView = WKWebView(frame: .zero, configuration: config)
                  webView.allowsBackForwardNavigationGestures = true
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  webView.navigationDelegate = context.coordinator
                  webView.uiDelegate = context.coordinator
                  webView.load(URLRequest(url: url))
                  return webView
              }

              func updateUIView(_ uiView: WKWebView, context: Context) {}

              final class Coordinator: NSObject, WKNavigationDelegate, WKUIDelegate {
                  // target=_blank 링크를 같은 창에서 열기
                  func webView(_ webView: WKWebView,
                               createWebViewWith configuration: WKWebViewConfiguration,
                               for navigationAction: WKNavigationAction,
                               windowFeatures: WKWindowFeatures) -> WKWebView? {
                      if navigationAction.targetFrame == nil {
                          webView.load(navigationAction.request)
                      }
                      return nil
                  }
              }
          }

          struct ContentView: View {
              private let liveURL = URL(string: "${LIVE_URL}")!

              var body: some View {
                  WebView(url: liveURL)
                      .ignoresSafeArea(.container, edges: .bottom)
              }
          }
          SWIFT

          # ---------- Info.plist (권한 문구 포함) ----------
          cat > Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>ko_KR</string>
            <key>CFBundleDisplayName</key><string>MBA Lounge</string>
            <key>CFBundleShortVersionString</key><string>$(MARKETING_VERSION)</string>
            <key>CFBundleVersion</key><string>$(CURRENT_PROJECT_VERSION)</string>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
            </array>
            <key>NSCameraUsageDescription</key>
            <string>프로필 사진 촬영을 위해 카메라를 사용합니다.</string>
            <key>NSPhotoLibraryUsageDescription</key>
            <string>프로필 사진 업로드를 위해 사진 보관함에 접근합니다.</string>
            <key>ITSAppUsesNonExemptEncryption</key><false/>
          </dict>
          </plist>
          PLIST

          # ---------- XcodeGen 스펙 ----------
          cat > project.yml <<YML
          name: MBALounge
          options:
            bundleIdPrefix: com.mba
            deploymentTarget:
              iOS: "16.0"
            createIntermediateGroups: true
          settings:
            base:
              MARKETING_VERSION: "${MARKETING_VERSION}"
              CURRENT_PROJECT_VERSION: "${BUILD_NUMBER}"
              DEVELOPMENT_TEAM: "${{ secrets.APPLE_TEAM_ID }}"
              CODE_SIGN_STYLE: Automatic
          targets:
            MBALounge:
              type: application
              platform: iOS
              sources:
                - Sources
                - Resources
              info:
                path: Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: "${BUNDLE_ID}"
                  PRODUCT_NAME: "MBALounge"
                  INFOPLIST_KEY_CFBundleDisplayName: "MBA Lounge"
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  TARGETED_DEVICE_FAMILY: "1"
                  SWIFT_VERSION: "5.0"
                  GENERATE_INFOPLIST_FILE: NO
          schemes:
            MBALounge:
              build:
                targets:
                  MBALounge: all
              run:
                config: Debug
              archive:
                config: Release
          YML

          echo "--- 생성된 파일 ---"
          ls -R

      # ------------------------------------------------------------------
      # 2) 앱 아이콘 생성 (라이브 사이트의 아이콘을 받아 1024로 변환)
      # ------------------------------------------------------------------
      - name: 앱 아이콘 준비
        run: |
          set -e
          cd build-ios
          ICONSET="Resources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"

          curl -fsSL -o /tmp/icon.png "https://728haven-oss.github.io/mba-lounge/icon-512.png"

          # 알파 채널 제거 + 1024x1024 변환 (App Store 필수 조건)
          sips -z 1024 1024 /tmp/icon.png --out "$ICONSET/AppIcon1024.png" >/dev/null

          # 알파 채널이 있으면 제거 (App Store 아이콘은 투명도 불가)
          # 원본은 알파가 없지만, 만약을 대비해 JPEG 왕복으로 평탄화
          HAS_ALPHA=$(sips -g hasAlpha "$ICONSET/AppIcon1024.png" | awk '/hasAlpha/{print $2}')
          echo "hasAlpha=$HAS_ALPHA"
          if [ "$HAS_ALPHA" = "yes" ]; then
            sips -s format jpeg -s formatOptions best "$ICONSET/AppIcon1024.png" --out /tmp/flat.jpg >/dev/null
            sips -s format png /tmp/flat.jpg --out "$ICONSET/AppIcon1024.png" >/dev/null
            echo "알파 제거 완료"
          fi
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICONSET/AppIcon1024.png"

          cat > "$ICONSET/Contents.json" <<'JSON'
          {
            "images" : [
              { "filename" : "AppIcon1024.png", "idiom" : "universal",
                "platform" : "ios", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON

          cat > Resources/Assets.xcassets/Contents.json <<'JSON'
          { "info" : { "author" : "xcode", "version" : 1 } }
          JSON

      # ------------------------------------------------------------------
      # 3) Xcode 프로젝트 생성
      # ------------------------------------------------------------------
      - name: XcodeGen 설치 및 프로젝트 생성
        run: |
          set -e
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1

          if brew install xcodegen; then
            echo "brew 설치 성공"
          else
            echo "brew 실패 → 공식 릴리스 바이너리로 설치"
            curl -fsSL -o /tmp/xcodegen.zip \
              https://github.com/yonaskolb/XcodeGen/releases/latest/download/xcodegen.zip
            rm -rf /tmp/xg && mkdir -p /tmp/xg
            unzip -q -o /tmp/xcodegen.zip -d /tmp/xg
            BIN=$(find /tmp/xg -type f -name xcodegen -perm -u+x | head -n 1)
            chmod +x "$BIN"
            export PATH="$(dirname "$BIN"):$PATH"
            echo "$(dirname "$BIN")" >> $GITHUB_PATH
          fi

          xcodegen --version
          cd build-ios
          xcodegen generate
          ls -la MBALounge.xcodeproj

      # ------------------------------------------------------------------
      # 4) App Store Connect API 키 배치
      # ------------------------------------------------------------------
      - name: API 키 설정
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/.appstoreconnect/private_keys/
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "키 배치 완료"

      # ------------------------------------------------------------------
      # 5) 아카이브 (자동 서명 — 인증서/프로파일을 애플이 자동 생성)
      # ------------------------------------------------------------------
      # 서명 없이 아카이브 → 서명은 내보내기 단계에서 (기기 등록 불필요)
      - name: 아카이브
        run: |
          set -e
          cd build-ios
          xcodebuild archive \
            -project MBALounge.xcodeproj \
            -scheme MBALounge \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/MBALounge.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            | tail -n 40
          ls -la build/MBALounge.xcarchive

      # ------------------------------------------------------------------
      # 6) IPA 내보내기
      # ------------------------------------------------------------------
      - name: IPA 내보내기
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -e
          cd build-ios
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$PWD/build/MBALounge.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/build/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          ls -la build/export

      # ------------------------------------------------------------------
      # 7) App Store Connect 업로드
      # ------------------------------------------------------------------
      - name: App Store Connect 업로드
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -e
          cd build-ios
          IPA=$(ls build/export/*.ipa | head -n 1)
          echo "업로드 파일: $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "업로드 완료 — App Store Connect에서 처리까지 5~30분 걸립니다."

      - name: 빌드 산출물 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build-ios/build/export/*.ipa
            build-ios/build/MBALounge.xcarchive
          retention-days: 7
          if-no-files-found: warn
